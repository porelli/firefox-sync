# Access control in front of the accounts pages (docs/single-sign-on.md): a client certificate,
# or a sign-in to Authelia first. Replaces the accounts.example.com server of fxa-example.conf
# (use one of the two servers below, not both). The other accounts hosts (API, profile,
# pairing) and the Sync server stay as they are: Firefox calls them in the background, without
# cookies or a client certificate.
# Ports: the defaults of .env (FXA_CONTENT_EXPORT_PORT 127.0.0.1:3030; Authelia: 127.0.0.1:9091).

# What Firefox and the servers fetch from this host on their own, open in both:
# - /.well-known/fxa-client-configuration: Firefox's configuration (identity.fxaccounts.autoconfig.uri)
# - /.well-known/openid-configuration: the admin UI's server, to sign in with these accounts
# - /__heartbeat__, /__lbheartbeat__: the admin UI's public checks, a monitoring

# 1. A client certificate signed by your CA (desktop Firefox: import it, docs/single-sign-on.md#firefox)
server {
  server_name accounts.example.com;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/accounts.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/accounts.example.com/privkey.pem;

  # asked for at the handshake, checked when given (one of another CA: refused), required below
  ssl_client_certificate /etc/nginx/client-ca.crt;
  ssl_verify_client optional;

  location ~ ^/(\.well-known/fxa-client-configuration|\.well-known/openid-configuration|__heartbeat__|__lbheartbeat__)$ {
    proxy_pass http://127.0.0.1:3030;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    if ($ssl_client_verify != SUCCESS) {
      return 403;
    }
    proxy_pass http://127.0.0.1:3030;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

