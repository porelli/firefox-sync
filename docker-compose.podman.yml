# Podman-specific override: longer healthcheck timings for rootless environments
# Usage (see PODMAN.md): DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock \
#   docker compose -f docker-compose.yml -f docker-compose.podman.yml up -d

services:
  syncstorage:
    # Increase healthcheck intervals for slower rootless environments
    healthcheck:
      interval: 45s
      timeout: 15s
      retries: 5
      start_period: 30s

  syncstorage_db:
    # Increase healthcheck timing for rootless environments
    healthcheck:
      start_period: 20s
      interval: 15s
      timeout: 10s
      retries: 5

  tokenserver_db:
    # Increase healthcheck timing for rootless environments
    healthcheck:
      start_period: 20s
      interval: 15s
      timeout: 10s
      retries: 5
