# Podman-specific docker-compose override
# Usage: podman-compose -f docker-compose.yml -f docker-compose.podman.yml up

services:
  syncstorage:
    # Increase healthcheck intervals for slower rootless environments
    healthcheck:
      interval: 45s
      timeout: 15s
      retries: 5
      start_period: 30s
    # Add security options for rootless
    security_opt:
      - label=disable
    
  syncstorage_db:
    # Increase healthcheck timing for rootless environments
    healthcheck:
      start_period: 20s
      interval: 15s
      timeout: 10s
      retries: 5
    # Add security options for rootless
    security_opt:
      - label=disable
    # Ensure proper permissions for rootless volumes
    userns_mode: "keep-id"
    
  tokenserver_db:
    # Increase healthcheck timing for rootless environments
    healthcheck:
      start_period: 20s
      interval: 15s
      timeout: 10s
      retries: 5
    # Add security options for rootless
    security_opt:
      - label=disable
    # Ensure proper permissions for rootless volumes
    userns_mode: "keep-id"
    
  tokenserver_db_init:
    # Add security options for rootless
    security_opt:
      - label=disable