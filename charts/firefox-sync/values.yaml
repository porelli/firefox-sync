# Default values for firefox-sync
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image configuration
image:
  repository: ghcr.io/porelli/firefox-sync
  pullPolicy: IfNotPresent
  # Tags for different components
  syncstorageTag: latest
  initTag: latest
  adminTag: latest

# The names of the chart's objects: <release>-<nameOverride, default firefox-sync>, or
# fullnameOverride as it is (the release name alone when it contains firefox-sync). Names
# over Kubernetes' limits are refused at render time (docs/install/helm.md#limits)
nameOverride: ""
fullnameOverride: ""

# Public domain for the Firefox Sync service (required)
# Example: https://sync.example.com
syncDomain: ""

# Maximum users allowed to use this server
# Formats: "N", "fixed:N", "initial:N", "unlimited", "initial:unlimited"
# - N or fixed:N: set on every start, read-only in admin UI
# - initial:N: set once on first start, then managed in admin UI
# (a number like 5 is taken as "5")
maxUsers: "1"

# FXA_SMTP_*: the SMTP server of the self-hosted accounts' emails (confirmation codes, sign-in
# codes) and of the admin UI's alerts and invitations (empty host: no emails from the admin UI).
# The password (FXA_SMTP_PASS) goes into the Secret, as the values say (see existingSecret)
smtp:
  host: ""
  port: 587
  user: ""
  password: ""
  # true: TLS from the start (port 465); false: STARTTLS
  secure: false
  # e.g. "Mozilla accounts <no-reply@example.com>"
  sender: ""
  # ADMIN_SMTP_INSECURE_AUTH (the admin UI's emails only): 1, true or yes sends the password also
  # to a server that offers no TLS, in clear (a relay you trust only); empty: refused
  insecureAuth: ""

# The Mozilla accounts Firefox signs in with: Mozilla's (the default), or your own with
# fxa.enabled (compose's compose/fxa.yml, see docs/accounts.md), with the names of .env below
fxa:
  # Mozilla's accounts (fxa.enabled false): FXA_OAUTH_SERVER_URL and FXA_EMAIL_DOMAIN of .env.
  # Ignored with fxa.enabled: the chart's auth server (http://<release>-firefox-sync-fxa-auth:9000/v1)
  # and the host of fxa.authUrl
  oauthServerUrl: https://oauth.accounts.firefox.com/v1
  emailDomain: api.accounts.firefox.com

  # the self-hosted accounts: their database, Redis, auth, content and profile servers (about
  # 3-4 GB of memory), on the three public URLs below (required), each a host of its own
  enabled: false
  # FXA_IMAGE (empty: image.repository) and FXA_VERSION: our builds of Mozilla's releases, amd64
  # and arm64; pin a release with e.g. fxa-mono-v1.347.1 (docs/upgrading.md#self-hosted-accounts). Mozilla's own
  # (amd64 only): repository docker.io/mozilla/fxa-mono, tag v1.347.1
  image:
    repository: ""
    tag: fxa-mono-latest
  # FXA_CONTENT_URL, FXA_AUTH_URL, FXA_PROFILE_URL, e.g. https://accounts.example.com,
  # https://api.example.com, https://profile.example.com
  contentUrl: ""
  authUrl: ""
  profileUrl: ""
  # FXA_SIGNUPS: who can create an account: open, allowlist (only the emails and @domains of
  # signupAllowlist) or closed; the admin UI changes them too. Existing accounts not affected
  signups: open
  # FXA_SIGNUP_ALLOWLIST: a list of emails and @domains (or one string, comma-separated)
  signupAllowlist: ""
  # FXA_MAX_ACCOUNTS: the most accounts that can be created, confirmed or not (0: nobody new),
  # formats as maxUsers: N or unlimited (or fixed:N) set on every start, read-only in the admin
  # UI; initial:N set once, then managed in the admin UI
  maxAccounts: "initial:unlimited"
  # FXA_ACCOUNT_EVENTS: true records the security history of every account (sign-ins, password,
  # 2-step and recovery key changes) with the IP address of each (docs/accounts.md#security-history)
  accountEvents: false
  # FXA_CLIENT_ADDRESS_DEPTH: the reverse proxies in front of the auth server + 1, for the client
  # IP of the rate limits: 2 for the Ingress controller alone (docs/reverse-proxy.md#client-ip-address)
  clientAddressDepth: 2
  # FXA_ACCESS_TOKEN_LIFETIME: how long Firefox's access tokens live (Mozilla's: "365 minutes")
  accessTokenLifetime: "60 minutes"
  # FXA_LOG_LEVEL of the auth server
  logLevel: INFO
  # ADMIN_FXA_CLIENT_ID: the OAuth client of the admin UI's sign-in with these accounts, used with
  # admin.fxaSignIn (16 hex characters; empty: derived from the namespace and the release, the
  # same on every upgrade), ADMIN_FXA_CLIENT_SECRET (64 hex, into the Secret as the values say;
  # keep it empty: the accounts refuse PKCE from clients with a secret)
  adminClientId: ""
  adminClientSecret: ""
  # a ConfigMap with the CA of your SMTP server or of your own HTTPS hosts (NODE_EXTRA_CA_CERTS
  # of the accounts' servers): its name and the key of the PEM file. Empty: the system CAs
  extraCaCerts:
    configMap: ""
    key: ca.crt
  # true: root init containers (keys-owner, images-owner, compose's fxa-keys-owner) chown the
  # new volumes to the image's user 10001, with CHOWN alone. false: none, fsGroup 10001 instead,
  # for a StorageClass that applies fsGroup (PodSecurity restricted then)
  volumeOwnerInit: true
  # NetworkPolicies (chart-only: compose has a network of its own): the accounts database and
  # Redis (its password FXA_REDIS_PASSWORD) take connections from the accounts' pods only (and
  # the admin UI's, for the database). Enforced where the cluster's network plugin does
  networkPolicy:
    enabled: true
    # the public servers (auth, content, profile, pairing) too: from your Ingress controller,
    # the release's own pods that call them and extraFrom only; else any pod of the cluster
    # reaches auth:9000 with an X-Forwarded-For of its choice (the rate limits' client IP),
    # around the sign-up gate. Off by default: the chart cannot know your controller
    # (docs/install/helm.md#networkpolicies), with enabled above
    servers:
      enabled: false
      # the controller's pods, one NetworkPolicy peer (both selectors: the pods of those
      # labels in the namespaces of those labels; podSelector alone: in the release's
      # namespace; namespaceSelector alone: every pod there, so with the controller in the
      # release's namespace set podSelector too; at least one required), e.g. ingress-nginx:
      #   namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      #   podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
      ingressController:
        namespaceSelector: {}
        podSelector: {}
      # more peers (NetworkPolicyPeer: podSelector, namespaceSelector, ipBlock), e.g. a
      # controller on the host network ({ipBlock: {cidr: 10.0.0.0/24}}) or your monitoring
      extraFrom: []

  # the accounts database: compose's fxa-db, or your own server (docs/databases.md#your-own-server)
  database:
    # FXA_DB: mysql or mariadb (docs/accounts.md#mysql-or-mariadb).
    # Independent of database.backend
    backend: mysql
    # FXA_DB_CONTAINERS: true runs the server (StatefulSet <release>-firefox-sync-fxa-db, as
    # root with FXA_MYSQL_PASSWORD); false: your own below, its passwords in existingSecret
    # (required then): FXA_MYSQL_PASSWORD (of external.user), FXA_MYSQL_POLICY_PASSWORD (of
    # external.policyUser)
    bundled: true
    # the server's image, also the client of the backups and of the wait for the server
    # (FXA_MYSQL_IMAGE, FXA_MARIADB_IMAGE): MySQL's and MariaDB's long-term major, as compose's.
    # mysql:lts (MySQL 9) needs an accounts image with mozilla/fxa#21554 (ours); with another
    # (Mozilla's, or ours from before) pin MySQL 8, docker.io/library/mysql:8: a MySQL 8 pin
    # gets compose's FXA_MYSQL_ARGS, --mysql-native-password=ON
    # --authentication-policy=mysql_native_password, any other image none. lts moves on to the
    # next major on its own (an image pull): pin a major to choose when, e.g. mysql:9, mariadb:12
    # (docs/upgrading.md#database-majors)
    image:
      mysql: docker.io/library/mysql:lts
      mariadb: docker.io/library/mariadb:lts
    # helm upgrade refuses an image that would move the running bundled server to another major
    # (its data upgraded for good at the next start), as database.allowMajorUpgrade: true lets
    # one upgrade do it (a backup first; from MySQL 8, its users moved off mysql_native_password
    # first, docs/upgrading.md#mysql-8-to-9), then set it back to false: --reuse-values keeps it
    allowMajorUpgrade: false
    external:
      # FXA_MYSQL_HOST (required): a host name or an IPv4 address the pods reach
      host: ""
      # FXA_MYSQL_PORT: empty for 3306
      port: ""
      # FXA_MYSQL_USER: owns the accounts' databases
      user: fxa
      # FXA_MYSQL_POLICY_USER: installs the sign-up policy and grants the admin UI's user
      # (empty: user above, with its password)
      policyUser: ffs_policy
      # FXA_DB_BOOTSTRAP_USER: an account that can create users, with which the auth pod's
      # db-bootstrap init container applies the accounts' setup migrations your server lacks
      # (db/mysql/setup/fxa-mysql or fxa-mariadb, filled in from these values) at every start;
      # its password in existingSecret (required then), key FXA_DB_BOOTSTRAP_PASSWORD. Empty:
      # db-bootstrap only checks that they are there (docs/databases.md#let-the-stack-apply-them)
      bootstrap:
        user: ""
    # the StatefulSet's volumeClaimTemplate, as database.persistence: set before the first install
    persistence:
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        memory: 512Mi

  # the accounts' caches and rate limits (compose's fxa-redis), in memory: the sessions and
  # refresh tokens are in the database
  redis:
    image: docker.io/library/redis:alpine
    resources:
      requests:
        memory: 64Mi

  # the auth server's signing keys: never regenerated silently, losing them signs everyone
  # out. On the PVC <release>-firefox-sync-fxa-keys (kept on helm uninstall), or in a Secret
  # of yours (existingSecret: secret-key.json, public-key.json, vapid-keys.json,
  # openid-key.json; the PVC is then not created), see docs/install/helm.md
  keys:
    existingSecret: ""
    persistence:
      size: 1Gi
      storageClass: ""

  # the avatars (PVC <release>-firefox-sync-fxa-profile-images, kept on helm uninstall)
  profileImages:
    persistence:
      size: 1Gi
      storageClass: ""

  # the QR code pairing server (compose's profile pairing) instead of Mozilla's
  pairing:
    enabled: false
    # FXA_PAIRING_URL (required with enabled), e.g. wss://pairing.example.com
    url: ""
    # FXA_PAIRING_IMAGE, empty: <image.repository>:fxa-channelserver-latest
    image: ""
    # FXA_PAIRING_TRUSTED_PROXIES: the proxies whose X-Forwarded-For it reads
    trustedProxies: "127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    resources: {}

  # the containers' resources: memory requests by default, no limits (init: the init
  # containers, empty: none)
  resources:
    auth:
      requests:
        memory: 1Gi
    content:
      requests:
        memory: 512Mi
    profile:
      requests:
        memory: 256Mi
    profileWorker:
      requests:
        memory: 128Mi
    profileStatic:
      requests:
        memory: 64Mi
    imgProxy:
      requests:
        memory: 32Mi
    init: {}

  # the four public hosts (contentUrl, authUrl, profileUrl, pairing.url) as Ingresses, one each;
  # with the admin UI also its sign-up gate on the auth host
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls:
      enabled: false
      # the certificates (empty: the controller's default)
      secretNames:
        content: ""
        auth: ""
        profile: ""
        pairing: ""

# Database configuration
database:
  # Backend type: mariadb, mysql, or postgres
  backend: mariadb

  # Whether to deploy bundled database containers
  bundled: true

  # The image of each backend's database server, also the client of the backups (and of the
  # wait for the server): compose's images (SYNC_MARIADB_IMAGE, SYNC_MYSQL_IMAGE,
  # SYNC_POSTGRES_IMAGE). MariaDB's and MySQL's lts move to their next long-term major by themselves:
  # the server upgrades the data at its next start, with no way back but a backup; pin a
  # major (e.g. docker.io/library/mysql:9) to choose when (docs/upgrading.md#database-majors). It pins the
  # major of the install for PostgreSQL: the official PostgreSQL image keeps its data at
  # /var/lib/postgresql/<major>/docker and refuses to start on an older major's data, so
  # moving to a newer one needs a dump and restore (docs/backups.md#restore) or pg_upgrade
  # (docs/upgrading.md#postgresql). With your own server (bundled: false) it is only
  # the client: pg_dump must be at least the server's major. Fully qualified (Docker Hub's
  # official images), for the nodes whose runtime has no default registry or another one
  image:
    mariadb: docker.io/library/mariadb:lts
    mysql: docker.io/library/mysql:lts
    # PostgreSQL has no lts: latest is its newest major, which a newer one replaces. A chart
    # cannot read the image's major at install as prepare_environment.sh does: pin it in your
    # values from the first install, docker.io/library/postgres:<major> (helm show values,
    # docs/upgrading.md#database-majors); left on latest a new PostgreSQL major does not start on the data
    # (the image's entrypoint refuses another major's, its db-major init container says what to pin)
    postgres: docker.io/library/postgres:latest

  # helm upgrade refuses a database.image.<backend> that would move the bundled server's data to
  # another major (a pin changed, a numbered major to lts or latest; read from the running
  # StatefulSet, not by helm template; lts itself moving on keeps the same image name and is not
  # seen: pin a major for that): true lets MariaDB and MySQL upgrade their data in place, a
  # backup first, there is no way back (docs/upgrading.md#database-majors). Never PostgreSQL, which cannot
  allowMajorUpgrade: false

  # PostgreSQL in the bundled server: the Sync server's own role (compose's
  # SYNC_POSTGRES_APP_USER), no superuser, the owner of the Sync tables
  # (docs/reference/database-users.md#postgresql). Not used with your own server,
  # where POSTGRES_USER (external.postgresUser) is the owner
  postgresSyncUser: syncserver_app

  # The admin UI's own database and its two users, both with ADMIN_DB_PASSWORD (compose's
  # ADMIN_DB_NAME, ADMIN_DB_USER, ADMIN_DB_SYNC_USER, docs/reference/database-users.md#the-admin-uis-own-database),
  # on the tokenserver's server: created by the bundled servers, by your database-setup.sql
  # on your own. Names: a-z, 0-9 and _
  admin:
    name: ffs_admin
    user: ffs_admin_ui
    syncUser: ffs_admin_sync

  # Your own database server (bundled: false), as docs/databases.md#your-own-server: create the databases and
  # users first with its SQL (db/mysql/setup/sync, db/postgres/setup/sync), the names below and
  # those of database.admin in it, and put their passwords in existingSecret (required then):
  # TOKENSERVER_DB_PASSWORD and STORAGE_DB_PASSWORD (mariadb, mysql) or POSTGRES_PASSWORD
  # (postgres: the password of postgresUser), ADMIN_DB_PASSWORD (the admin UI's users)
  external:
    # compose's SYNC_TOKENSERVER_DB_HOST or SYNC_POSTGRES_HOST (required): a host name or an
    # IPv4 address the pods reach (plain connections, docs/databases.md#server-requirements)
    host: ""
    # its port (SYNC_TOKENSERVER_DB_PORT, SYNC_POSTGRES_PORT; 1-65535, a number or quoted);
    # empty for 3306 (mariadb, mysql) or 5432 (postgres)
    port: ""
    # mariadb, mysql: the storage database on another server (SYNC_STORAGE_DB_HOST,
    # _PORT); empty: host and port above
    storageHost: ""
    storagePort: ""
    # mariadb, mysql: SYNC_TOKENSERVER_DB_NAME, _USER, SYNC_STORAGE_DB_NAME, _USER
    tokenserverDatabase: tokenserver
    tokenserverUser: tokenserver
    storageDatabase: syncstorage
    storageUser: syncstorage
    # postgres: SYNC_POSTGRES_NAME, SYNC_POSTGRES_USER (the owner of that database, no superuser)
    postgresDatabase: syncserver
    postgresUser: syncserver
    # mariadb, mysql: SYNC_DB_TLS_VERIFY of the init container and the backups, whether their
    # client checks the server's certificate: false, as prepare_environment.sh writes for your
    # own server (MySQL's own certificate is self-signed, and the CA of a managed service is
    # not in the images: ERROR 2026). true only with a certificate from a CA the images
    # trust (their system CAs) for this host name. The Sync server itself connects without TLS
    tlsVerify: false
    # SYNC_DB_BOOTSTRAP_USER: an account that can create users, with which the Sync server's
    # db-bootstrap init container applies the setup migrations your server lacks
    # (db/mysql/setup/sync or db/postgres/setup/sync, filled in from these values and the
    # Secret) at every start, one replica at a time; its password in existingSecret (required
    # then), key SYNC_DB_BOOTSTRAP_PASSWORD. Empty: db-bootstrap only checks that they are
    # there, and stops the start naming what is missing (docs/databases.md#let-the-stack-apply-them)
    bootstrap:
      user: ""

  # Persistence configuration for bundled databases: the StatefulSets' volumeClaimTemplates,
  # which Kubernetes never changes. Set them before the first install: helm upgrade refuses
  # another size or storageClass (read from the running StatefulSets). To grow a volume,
  # resize its PVC (data-<release>-firefox-sync-<server>-0) with a StorageClass that has
  # allowVolumeExpansion (docs/install/helm.md#volumes)
  persistence:
    # Size of persistent volume
    size: 8Gi
    # Storage class (empty for default)
    storageClass: ""

  # The database servers' container (each of them: two with MariaDB and MySQL, one with
  # PostgreSQL), e.g. requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}. Empty:
  # none, as the Sync server's: what they need grows with the data and the accounts, and a
  # memory limit set too low gets the server OOM-killed mid-write (docs/install/helm.md#resources)
  resources: {}

# Name of existing secret containing database passwords and secrets, with the keys
# SYNC_MASTER_SECRET, METRICS_HASH_SECRET, ADMIN_PASSWORD, ADMIN_DB_PASSWORD (the admin UI's
# database users) and TOKENSERVER_DB_PASSWORD + STORAGE_DB_PASSWORD (mariadb, mysql) or
# POSTGRES_PASSWORD (the superuser) + POSTGRES_SYNC_PASSWORD (the Sync server's role) (postgres;
# with your own server POSTGRES_PASSWORD alone, the owner's: required then, see database.external);
# optional, for the admin UI (missing or empty: that feature off): FXA_SMTP_PASS,
# ADMIN_OIDC_CLIENT_SECRET, ADMIN_METRICS_TOKEN, ADMIN_NOTIFY. The admin.password,
# smtp.password, admin.oidc.clientSecret, admin.metricsToken and admin.notify values
# are ignored then.
# With fxa.enabled also FXA_MYSQL_PASSWORD, FXA_ADMIN_DB_PASSWORD, FXA_AUTH_SECRET,
# FXA_OAUTH_SECRET, FXA_PROFILE_SECRET, FXA_FLOW_ID_KEY, FXA_SESSION_TOKEN_HANDLE_KEY,
# FXA_CONTENT_SESSION_SECRET, FXA_REDIS_PASSWORD (the chart's own, not in .env) (an upgrade
# that turns the accounts on fails while one is missing), FXA_MYSQL_POLICY_PASSWORD with your
# own accounts server, and optionally ADMIN_FXA_CLIENT_SECRET (fxa.adminClientSecret ignored
# then).
# Without existingSecret those optional ones are managed by the values alone: written into the
# chart's Secret on every install and upgrade, an empty value is an empty key (the feature
# off), whatever was set in the Secret by hand. Manage them out of band with existingSecret.
# If not set, a secret named like the release (<release>-firefox-sync) is generated on the
# first install and kept as it is on upgrades (and on uninstall, like the database volumes).
# REQUIRED when the chart is rendered with `helm template` or a GitOps tool that renders it
# (Argo CD...): there the chart cannot read the Secret back from the cluster, and
# would generate a new SYNC_MASTER_SECRET, METRICS_HASH_SECRET and database passwords on
# every render (every Firefox signed out, the databases refusing the new passwords)
existingSecret: ""

# Syncstorage service configuration
syncstorage:
  # Number of replicas: more than one runs the migrations and the MAX_USERS init
  # concurrently, which is not tested
  replicas: 1

  # Resource limits and requests
  resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Its init containers (wait-db, sync-role, migrate, db-init), one at a time before it:
  # migrate runs a whole Sync server for its migrations, so give it about what resources
  # has (empty: none). A namespace with a ResourceQuota on cpu or memory needs these too
  initResources: {}

  # Service configuration
  service:
    # Service port
    port: 8000

# The admin UI (compose's ffs-admin, see docs/admin/README.md): max users, accounts, health, metrics,
# alerts. Not published: kubectl port-forward svc/<release>-firefox-sync-admin 8090:8080,
# or admin.ingress below behind your own sign-in. The Sync server sends it its metrics
# (statsd, SYNC_STATSD_HOST) only while it is on. As in .env-example, with the names of .env
admin:
  enabled: false
  # ADMIN_PASSWORD: empty generates one into the Secret (kept on upgrades); read it with
  # kubectl get secret <release>-firefox-sync -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
  password: ""
  # ADMIN_ALERT_EMAIL: email alerts (refused sign-ups, components down, new releases, admin
  # sign-ins), sent with the SMTP server of smtp above
  alertEmail: ""
  # ADMIN_OIDC_*: sign-in with OpenID Connect (docs/admin/signing-in.md#openid-connect); the client secret
  # (ADMIN_OIDC_CLIENT_SECRET, empty: a public client) goes into the Secret, as the values say
  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    # the exact public callback URL, https://<admin host>/auth/callback
    redirectUrl: ""
    # default "openid email profile"
    scopes: ""
    # the button label, default "single sign-on"
    name: ""
    # the claim with the groups, default "groups"
    groupsClaim: ""
    # true: accept emails without email_verified=true (risky, see docs/admin/signing-in.md#openid-connect)
    trustUnverifiedEmail: ""
  # ADMIN_AUTH_HEADER, ADMIN_AUTH_GROUPS_HEADER, ADMIN_TRUSTED_PROXIES: sign-in with the
  # header of a forward-auth proxy, only from these CIDRs (the proxy as the pod sees it)
  trustedHeader:
    header: ""
    groupsHeader: ""
    trustedProxies: ""
  # ADMIN_ALLOWED_USERS, ADMIN_ALLOWED_GROUPS: with OpenID Connect or the header, who is an
  # admin (emails and @domains, groups; comma-separated)
  allowed:
    users: ""
    groups: ""
  # ADMIN_INSECURE_COOKIE: 1, true or yes sends the session cookie also over plain HTTP (an
  # Ingress without TLS, an http:// oidc.redirectUrl: anybody on the way can take it); empty:
  # HTTPS and http://localhost only (kubectl port-forward)
  insecureCookie: ""
  # ADMIN_NOTIFY: alerts also to Slack, Discord, Teams, ntfy, Gotify, Telegram, Matrix or
  # a webhook (docs/admin/alerts.md#destinations): a list of URLs, one per destination (or one string, the
  # URLs separated by commas, as in .env), e.g.
  #   notify: ["ntfy://ntfy.sh/my-secret-topic", "slack://hooks.slack.com/services/T000/B000/XXXX"]
  # They hold tokens: into the Secret as the values say (empty: off, see existingSecret)
  notify: []
  # ADMIN_METRICS_TOKEN: Prometheus metrics at /metrics with this bearer token (empty:
  # off), into the Secret as the values say
  metricsToken: ""
  # ADMIN_TZ: time zone of the pages and the alerts, e.g. Europe/Rome (empty: UTC)
  tz: ""
  # ADMIN_PUBLIC_CHECK: every hour the public https URLs and their certificates (false: never)
  publicCheck: true
  # ADMIN_UPDATE_CHECK: compare the running versions with the newest releases on GitHub
  updateCheck: true
  # ADMIN_STALE_DAYS: accounts not synced for this many days are marked inactive
  staleDays: 90
  # ADMIN_RETENTION_DAYS, ADMIN_AUDIT_RETENTION_DAYS: days of metrics and events, and of the
  # events of the admins, kept
  retentionDays: 30
  auditRetentionDays: 365
  # ADMIN_PURGE: "1" deletes the Sync data nobody reads any more every day (docs/admin/storage.md)
  purge: ""
  # ADMIN_ERROR_RATE_PERCENT, ADMIN_ERROR_RATE_MIN_ERRORS: an alert on a spike of Sync errors
  errorRatePercent: 10
  errorRateMinErrors: 20
  # ADMIN_DB_GROWTH_MB, ADMIN_DB_GROWTH_FACTOR: an alert on a database growing fast
  dbGrowthMb: 1024
  dbGrowthFactor: 5
  # the self-hosted accounts only (fxa.enabled), passed as compose does:
  # ADMIN_DELETE_UNCONFIRMED_DAYS, ADMIN_SIGNUP_BURST
  deleteUnconfirmedDays: ""
  signupBurst: 10
  # ADMIN_UNCONFIRMED_HOURS (fxa.enabled): an account that has not confirmed its email this
  # many hours after its sign-up is marked unconfirmed in the accounts list (empty: 72)
  unconfirmedHours: ""
  # with fxa.enabled: sign in to the admin UI with the self-hosted accounts (OpenID Connect,
  # ADMIN_FXA_CLIENT_ID), who may in admin.allowed (required then). It comes back to
  # oidc.redirectUrl, empty: https://<ingress.host>/auth/callback (one of them required); the
  # oidc.* left empty take the accounts' (issuer fxa.contentUrl, name "Mozilla account",
  # trustUnverifiedEmail true: the accounts confirm every sign-in by email)
  fxaSignIn: false

  # the admin UI's container and its init container (wait-sync)
  resources: {}

  # Its own Ingress, apart from the Sync server's: <release>-firefox-sync-admin:8080 at / of
  # host (required, not the Sync server's), only while admin.enabled and this are both on.
  # Put it behind your own sign-in (OpenID Connect, a forward-auth proxy, an allowlist):
  # the admin UI can delete accounts and change who signs up (docs/admin/signing-in.md)
  ingress:
    enabled: false
    className: ""
    host: ""
    tls:
      enabled: false
      secretName: ""
    annotations: {}

# The backups, compose's backup service (docs/backups.md#the-backup-service): a CronJob <release>-firefox-sync-backup
# dumps the Sync databases and the admin UI's into the PVC <release>-firefox-sync-backups
# (kept on helm uninstall), sync/<UTC time>/<database>.sql.gz, as the stack's users (PostgreSQL:
# the Sync server's role, never the superuser); each run shows on the admin UI's Backups card.
# One now (a new Job name each time):
#   kubectl create job --from=cronjob/<release>-firefox-sync-backup backup-now-$(date +%s)
# Restoring: docs/backups.md#restore-on-kubernetes. With your own server too (database.bundled=false: as the users
# of its SQL, PostgreSQL as postgresUser, with database.image.<backend> as the client, at least
# the server's major), next to the server's own backups
backup:
  enabled: false
  # cron format, in UTC (the CronJob's timeZone). A daily "M H * * *" is also BACKUP_TIME
  # (HH:MM) of the admin UI's help. Any other schedule runs as given, but that help is then
  # approximate ("every night at 03:00", its default); and one rarer than every 36 hours
  # makes the admin UI's alert that the last good backup is too old fire between runs
  schedule: "0 3 * * *"
  # BACKUP_KEEP: the newest runs kept, older ones deleted (a failed run deletes nothing)
  keep: 7
  # a run still going after this many seconds is stopped (and fails): under the CronJob's
  # concurrencyPolicy Forbid a hung dump would hold back every later run
  activeDeadlineSeconds: 82800
  persistence:
    size: 10Gi
    storageClass: ""
  # the backup container (and the one-shot Job that binds the PVC at install): the dump's
  # client, gzip (empty: none)
  resources: {}

# The Sync server's Ingress: <release>-firefox-sync-syncstorage at / of host (never the admin
# UI, which has admin.ingress)
ingress:
  enabled: false
  className: ""
  # empty: the host of syncDomain, which Firefox is given as the Sync node
  host: ""
  # TLS for that host, with the certificate of secretName (empty: the controller's default)
  tls:
    enabled: false
    secretName: ""
  # Additional annotations
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"

# The pull secrets of every pod, for a registry that needs a login (a mirror of
# ghcr.io/porelli/firefox-sync and Docker Hub, a private image.repository):
#   imagePullSecrets: [{name: my-registry}]
imagePullSecrets: []

# Where every pod of the chart runs (the Sync server, the admin UI, the database servers,
# the backups), as in a pod spec: nodeSelector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# Annotations on every pod of the chart (next to the chart's own checksums)
podAnnotations: {}
