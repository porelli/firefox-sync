{{- /*
The bundled databases, as compose's tokenserver_db and syncstorage_db (MariaDB, or MySQL
with compose/sync-mysql.yml) or postgres_db (compose/sync-postgres.yml)
*/ -}}
{{- if .Values.database.bundled }}
{{- include "firefox-sync.checkDbBackend" . }}
{{- include "firefox-sync.checkDbMajor" . }}
{{- $root := . }}
{{- $backend := .Values.database.backend }}
{{- $persistence := .Values.database.persistence }}
{{- $dbs := list }}
{{- if eq $backend "postgres" }}
{{- $dbs = list (dict "component" "postgres" "db" "tokenserver") }}
{{- else }}
{{- $dbs = list (dict "component" "tokenserver-db" "db" "tokenserver") (dict "component" "storage-db" "db" "storage") }}
{{- end }}
{{- /* their volumes as they were created: Kubernetes never changes a StatefulSet's
volumeClaimTemplates, and would refuse that only once the objects before it were changed */}}
{{- range $dbs }}
{{- include "firefox-sync.checkStatefulSetClaim" (dict "root" $root "name" (include "firefox-sync.dbHost" (dict "root" $root "db" .db)) "claim" "data"
  "setting" "database.persistence" "persistence" $persistence) }}
{{- end }}
---
# db/mysql/admin-user.sh (a copy in files/, kept identical): the admin UI's users, run by the
# MariaDB and MySQL containers before the image's entrypoint, as in compose; PostgreSQL:
# db/postgres/keep-major.sh (files/postgres-keep-major.sh), its db-major init container
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firefox-sync.fullname" $root }}-db-scripts
  labels:
    {{- include "firefox-sync.labels" (dict "root" $root "component" "db-scripts") | nindent 4 }}
data:
  {{- if eq $backend "postgres" }}
  keep-major.sh: |
    {{- $root.Files.Get "files/postgres-keep-major.sh" | trimSuffix "\n" | nindent 4 }}
  {{- else }}
  admin-user.sh: |
    {{- $root.Files.Get "files/admin-user.sh" | trimSuffix "\n" | nindent 4 }}
  {{- end }}
{{- range $dbs }}
{{- $component := .component }}
{{- $role := .db }}
{{- $name := include "firefox-sync.dbHost" (dict "root" $root "db" .db) }}
{{- $dbName := include "firefox-sync.dbName" (dict "root" $root "db" .db) }}
{{- $dbUser := include "firefox-sync.dbUser" (dict "root" $root "db" .db) }}
{{- $passwordKey := include "firefox-sync.dbPasswordKey" (dict "root" $root "db" .db) }}
{{- $port := include "firefox-sync.dbPort" (dict "root" $root) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "firefox-sync.selectorLabels" (dict "root" $root "component" $component) | nindent 4 }}
  ports:
    - name: db
      port: {{ $port }}
      targetPort: db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "firefox-sync.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firefox-sync.selectorLabels" (dict "root" $root "component" $component) | nindent 8 }}
      {{- $annotations := dict }}
      {{- /* admin-user.sh, keep-major.sh run at the start: a new pod when they change */}}
      {{- $_ := set $annotations "checksum/db-scripts" ($root.Files.Get (ternary "files/postgres-keep-major.sh" "files/admin-user.sh" (eq $backend "postgres")) | sha256sum) }}
      {{- with include "firefox-sync.podAnnotations" (dict "root" $root "annotations" $annotations) }}{{ . | trim | nindent 6 }}{{ end }}
    spec:
      {{- include "firefox-sync.podSpec" $root | nindent 6 }}
      # root at the start (the image's entrypoint chowns the data, then drops to its user
      # with gosu): PodSecurity baseline, not restricted (docs/install/helm.md#requirements)
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if eq $backend "postgres" }}
      # PostgreSQL keeps its data in <major>/docker: an image of another major (latest moving
      # on, another pin) finds none of its own. Its entrypoint refuses then; this says first
      # what to pin (db/postgres/keep-major.sh, as compose's postgres_db)
      initContainers:
        - name: db-major
          image: {{ include "firefox-sync.dbImage" $root }}
          {{- include "firefox-sync.noEscalation" $root | nindent 10 }}
          {{- with $root.Values.database.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # (the names for its message as arguments: no env, nothing of the Secret here)
          command: [env, {{ printf "FFS_POSTGRES_IMAGE=%s" (include "firefox-sync.dbImage" $root) | quote }}, FFS_POSTGRES_SETTING=database.image.postgres, sh, /ffs-db/keep-major.sh, "true"]
          # (read-write though it only reads: the images before 18 declare a VOLUME at
          # /var/lib/postgresql/data, whose mount point cannot be made in a read-only mount)
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: db-scripts
              mountPath: /ffs-db
              readOnly: true
      {{- end }}
      containers:
        {{- $check := list }}
        - name: db
          image: {{ include "firefox-sync.dbImage" $root }}
          {{- include "firefox-sync.noEscalation" $root | nindent 10 }}
          {{- with $root.Values.database.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq $backend "mariadb" }}
          args: [sh, /ffs-db/admin-user.sh, mariadbd, --explicit_defaults_for_timestamp]
          env:
            - name: MARIADB_RANDOM_ROOT_PASSWORD
              value: "true"
            - name: MARIADB_DATABASE
              value: {{ $dbName | quote }}
            - name: MARIADB_USER
              value: {{ $dbUser | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" $root "name" "MARIADB_PASSWORD" "key" $passwordKey) | nindent 12 }}
            - name: MARIADB_AUTO_UPGRADE
              value: "true"
            {{- include "firefox-sync.adminUserEnv" (dict "root" $root "role" $role) | nindent 12 }}
          {{- $check = list "healthcheck.sh" "--connect" "--innodb_initialized" }}
          {{- else if eq $backend "mysql" }}
          # no binary logging, as compose/sync-mysql.yml: the init container's MAX_USERS
          # procedure and trigger would otherwise need log_bin_trust_function_creators; MyISAM
          # tables (the refusals of allowedAccounts) checked and repaired when opened after a crash
          args: [sh, /ffs-db/admin-user.sh, mysqld, --disable-log-bin, "--myisam-recover-options=BACKUP,FORCE"]
          env:
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
            - name: MYSQL_DATABASE
              value: {{ $dbName | quote }}
            - name: MYSQL_USER
              value: {{ $dbUser | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" $root "name" "MYSQL_PASSWORD" "key" $passwordKey) | nindent 12 }}
            {{- include "firefox-sync.adminUserEnv" (dict "root" $root "role" $role) | nindent 12 }}
          {{- /* the password in mysqladmin's environment, not in its arguments (ps on the node) */}}
          {{- $check = list "sh" "-c" "MYSQL_PWD=${MYSQL_PASSWORD} mysqladmin ping -h 127.0.0.1 --protocol=tcp -u\"${MYSQL_USER}\" --silent" }}
          {{- else }}
          env:
            - name: POSTGRES_DB
              value: {{ $dbName | quote }}
            - name: POSTGRES_USER
              value: {{ $dbUser | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" $root "name" "POSTGRES_PASSWORD" "key" $passwordKey) | nindent 12 }}
          {{- $check = list "sh" "-c" "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\"" }}
          {{- end }}
          # compose's healthcheck. The first start (a new database, or a long recovery) has
          # up to 30 minutes; ready as compose's healthy; restarted only after 5 minutes
          # without an answer, compose would only mark it unhealthy
          startupProbe:
            exec:
              command: {{ toJson $check }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command: {{ toJson $check }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: {{ ternary 10 3 (eq $backend "mysql") }}
          livenessProbe:
            exec:
              command: {{ toJson $check }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          ports:
            - name: db
              containerPort: {{ $port }}
          volumeMounts:
            - name: data
              {{- if eq $backend "postgres" }}
              # the official image keeps its data in a subdirectory of the major (PGDATA
              # /var/lib/postgresql/<major>/docker): another major finds none (db-major above)
              mountPath: /var/lib/postgresql
              {{- else }}
              # a subdirectory: MariaDB and MySQL refuse to initialise next to the lost+found
              # of a fresh ext4 volume
              mountPath: /var/lib/mysql
              subPath: data
            - name: db-scripts
              mountPath: /ffs-db
              readOnly: true
              {{- end }}
      volumes:
        - name: db-scripts
          configMap:
            name: {{ include "firefox-sync.fullname" $root }}-db-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $persistence.size }}
{{- end }}
{{- end }}
