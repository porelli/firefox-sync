{{- /*
The accounts' public hosts (fxa.ingress.enabled), an Ingress each (the pairing server's with
it), as the server blocks of proxy/nginx.conf (setup/proxy.sh): one host failing (its certificate, its
rule) leaves the others up, and a certificate each (tls.secretNames.<host>, empty: the
controller's default) keeps cert-manager's per-host issuance working. The profile host's /img/ goes to img-proxy (port img), which strips
the prefix as nginx's proxy_pass .../ does, so no controller-specific rewrite is needed. With the
admin UI, the API host's POST /v1/account/create goes to its sign-up gate (port 8081), as
proxy/nginx.conf's location = /v1/account/create: an Exact path for every method, the gate
passes on what is not that POST (OPTIONS preflights) to auth; the database refuses what the
policy does not allow whatever the routing, the gate makes the refusals readable.
Each path: (path pathType Service port)
*/ -}}
{{- if and .Values.fxa.enabled .Values.fxa.ingress.enabled }}
{{- $fullname := include "firefox-sync.fullname" . }}
{{- $f := .Values.fxa }}
{{- $content := printf "%s-fxa-content" $fullname }}
{{- $auth := printf "%s-fxa-auth" $fullname }}
{{- $profile := printf "%s-fxa-profile" $fullname }}
{{- $authPaths := list (list "/" "Prefix" $auth 9000) }}
{{- if .Values.admin.enabled }}
{{- $authPaths = append $authPaths (list "/v1/account/create" "Exact" (include "firefox-sync.adminService" .) 8081) }}
{{- end }}
{{- $ingresses := list
  (dict "name" "content" "url" $f.contentUrl "paths" (list (list "/" "Prefix" $content 3030)))
  (dict "name" "auth" "url" $f.authUrl "paths" $authPaths)
  (dict "name" "profile" "url" $f.profileUrl "paths" (list (list "/" "Prefix" $profile 1111) (list "/img/" "Prefix" $profile 1114))) }}
{{- if $f.pairing.enabled }}
{{- /* (its websockets as they are: an HTTP Upgrade, which the controllers pass on) */}}
{{- $ingresses = append $ingresses (dict "name" "pairing" "url" $f.pairing.url "paths" (list (list "/" "Prefix" (printf "%s-fxa-pairing" $fullname) 8000))) }}
{{- end }}
{{- range $ingresses }}
{{- $host := include "firefox-sync.fxaHost" (dict "root" $ "url" .url) }}
{{- $service := printf "%s-fxa-%s" $fullname .name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $service }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" $ "component" (printf "fxa-%s" .name)) | nindent 4 }}
  {{- with $f.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $f.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $f.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- with index $f.ingress.tls.secretNames .name }}
      secretName: {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ index . 0 }}
            pathType: {{ index . 1 }}
            backend:
              service:
                name: {{ index . 2 }}
                port:
                  number: {{ index . 3 }}
          {{- end }}
{{- end }}
{{- end }}
