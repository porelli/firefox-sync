{{- /*
The Sync server. Compose's one-shot containers are its init containers, in compose's
order, so that it never serves before the migrations and the MAX_USERS init succeeded:
a failing init keeps the pod in Init:Error (and out of the Service), without fallback.
*/ -}}
{{- include "firefox-sync.checkValues" . }}
{{- include "firefox-sync.checkNames" . }}
{{- $fullname := include "firefox-sync.fullname" . }}
{{- $backend := .Values.database.backend }}
{{- $port := include "firefox-sync.dbPort" (dict "root" . "db" "tokenserver") }}
{{- $dbs := list "tokenserver" }}
{{- if ne $backend "postgres" }}
{{- $dbs = append $dbs "storage" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-syncstorage
  labels:
    {{- include "firefox-sync.labels" (dict "root" . "component" "syncstorage") | nindent 4 }}
spec:
  selector:
    {{- include "firefox-sync.selectorLabels" (dict "root" . "component" "syncstorage") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.syncstorage.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-syncstorage
  labels:
    {{- include "firefox-sync.labels" (dict "root" . "component" "syncstorage") | nindent 4 }}
spec:
  # more than one replica runs the migrations concurrently: not tested
  replicas: {{ .Values.syncstorage.replicas }}
  # stop, then start, like compose: never two migrations at once on an upgrade
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "firefox-sync.selectorLabels" (dict "root" . "component" "syncstorage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firefox-sync.selectorLabels" (dict "root" . "component" "syncstorage") | nindent 8 }}
      {{- $annotations := dict }}
      {{- if not .Values.database.bundled }}
      {{- /* a new db-setup.sh or SQL (a chart upgrade) restarts the pod: db-bootstrap runs it */}}
      {{- $_ := set $annotations "checksum/db-setup" (include "firefox-sync.dbSetupData" . | sha256sum) }}
      {{- end }}
      {{- with include "firefox-sync.podAnnotations" (dict "root" . "annotations" $annotations) }}{{ . | trim | nindent 6 }}{{ end }}
    spec:
      {{- include "firefox-sync.podSpec" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # the database servers answer (up to 5 minutes), without credentials: no password
        # leaves the pod here; a refused password stops the migrate step after it
        - name: wait-db
          image: {{ include "firefox-sync.dbImage" . }}
          imagePullPolicy: IfNotPresent
          {{- include "firefox-sync.noEscalation" . | nindent 10 }}
          {{- with include "firefox-sync.initResources" . }}{{ . | trim | nindent 10 }}{{ end }}
          command: [/bin/sh, -c]
          args:
            - |
              deadline=$(( $(date +%s) + 300 ))
              wait_db() {
                {{- if eq $backend "postgres" }}
                until out=$(pg_isready -h "$1" -p "$2" -t 5 2>&1); do
                {{- else }}
                # ping is alive also when the (empty) login is refused
                until out=$({{ ternary "mysqladmin" "mariadb-admin" (eq $backend "mysql") }} --connect-timeout=5 -h "$1" -P "$2" ping 2>&1); do
                {{- end }}
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "Timeout waiting for $1:$2: $out"; exit 1
                  fi
                  sleep 2
                done
                echo "$1:$2 answers"
              }
              {{- range $dbs }}
              {{- $d := dict "root" $ "db" . }}
              wait_db {{ include "firefox-sync.dbHost" $d | quote }} {{ include "firefox-sync.dbPort" $d | quote }}
              {{- end }}
        {{- if not .Values.database.bundled }}
        # compose's db-bootstrap: your own server's users, grants and databases (the SQL of
        # db/mysql/sync.sql or db/postgres/sync.sql, filled in from the values and the Secret)
        # applied as database.external.bootstrap.user, or checked as the stack's users: what
        # is missing stops the pod here, named in its log (db/db-setup.sh,
        # docs/databases.md#when-a-release-needs-new-users-or-grants)
        - name: db-bootstrap
          image: {{ include "firefox-sync.dbImage" . }}
          imagePullPolicy: IfNotPresent
          {{- include "firefox-sync.noEscalation" . | nindent 10 }}
          {{- with include "firefox-sync.initResources" . }}{{ . | trim | nindent 10 }}{{ end }}
          command: [bash, /ffs-db/db-setup.sh]
          args: [sync]
          env:
            {{- $ts := dict "root" . "db" "tokenserver" }}
            - name: SYNC_DB_CONTAINERS
              value: "0"
            {{- $boot := .Values.database.external.bootstrap.user }}
            - name: SYNC_DB_BOOTSTRAP_USER
              value: {{ $boot | quote }}
            {{- if $boot }}
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "SYNC_DB_BOOTSTRAP_PASSWORD" "key" "SYNC_DB_BOOTSTRAP_PASSWORD") | nindent 12 }}
            {{- else }}
            - name: SYNC_DB_BOOTSTRAP_PASSWORD
              value: ""
            {{- end }}
            {{- if eq $backend "postgres" }}
            - name: FFS_DB_ENGINE
              value: postgres
            - name: SYNC_POSTGRES_HOST
              value: {{ include "firefox-sync.dbHost" $ts | quote }}
            - name: SYNC_POSTGRES_PORT
              value: {{ $port | quote }}
            - name: SYNC_POSTGRES_NAME
              value: {{ include "firefox-sync.dbName" $ts | quote }}
            - name: SYNC_POSTGRES_USER
              value: {{ include "firefox-sync.dbUser" $ts | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "SYNC_POSTGRES_PASSWORD" "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- else }}
            {{- range $db, $part := dict "tokenserver" "TOKENSERVER" "storage" "STORAGE" }}
            {{- $d := dict "root" $ "db" $db }}
            - name: SYNC_{{ $part }}_DB_HOST
              value: {{ include "firefox-sync.dbHost" $d | quote }}
            - name: SYNC_{{ $part }}_DB_PORT
              value: {{ include "firefox-sync.dbPort" $d | quote }}
            - name: SYNC_{{ $part }}_DB_NAME
              value: {{ include "firefox-sync.dbName" $d | quote }}
            - name: SYNC_{{ $part }}_DB_USER
              value: {{ include "firefox-sync.dbUser" $d | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" $ "name" (printf "SYNC_%s_DB_PASSWORD" $part) "key" (include "firefox-sync.dbPasswordKey" $d)) | nindent 12 }}
            {{- end }}
            - name: SYNC_DB_TLS_VERIFY
              value: {{ include "firefox-sync.tlsVerify" . | quote }}
            {{- end }}
            - name: ADMIN_DB_USER
              value: {{ include "firefox-sync.adminDbUser" . }}
            - name: ADMIN_DB_SYNC_USER
              value: {{ include "firefox-sync.adminDbSyncUser" . }}
            {{- /* (optional: MariaDB and MySQL without the admin UI and the backups may have none, the
            Sync part of the SQL only then) */}}
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "ADMIN_DB_PASSWORD" "key" "ADMIN_DB_PASSWORD" "optional" true) | nindent 12 }}
            - name: ADMIN_DB_NAME
              value: {{ include "firefox-sync.adminDbName" . }}
          volumeMounts:
            - name: db-setup
              mountPath: /ffs-db
              readOnly: true
        {{- end }}
        {{- if eq $backend "postgres" }}
        # compose's sync_role_init: the Sync server's own role (no superuser), before the
        # migrations, which run as it; no superuser session touches what that role owns
        - name: sync-role
          image: {{ include "firefox-sync.image" (dict "root" . "name" "init") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [sync-role]
          {{- include "firefox-sync.noEscalation" . | nindent 10 }}
          {{- with include "firefox-sync.initResources" . }}{{ . | trim | nindent 10 }}{{ end }}
          env:
            {{- $ts := dict "root" . "db" "tokenserver" }}
            - name: POSTGRES_SERVER
              value: {{ include "firefox-sync.dbHost" $ts | quote }}
            - name: POSTGRES_SERVER_PORT
              value: {{ $port | quote }}
            - name: POSTGRES_DATABASE
              value: {{ include "firefox-sync.dbName" $ts | quote }}
            - name: POSTGRES_USER
              value: {{ include "firefox-sync.dbUser" $ts | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- include "firefox-sync.postgresSyncEnv" . | nindent 12 }}
        {{- end }}
        # compose's syncstorage_migrate: the migrations (and the Sync node) without serving
        # (PostgreSQL: as the Sync server's own role, like the Sync server)
        - name: migrate
          image: {{ include "firefox-sync.image" (dict "root" . "name" "syncstorage") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "firefox-sync.syncstorageEnv" . | nindent 12 }}
          {{- include "firefox-sync.syncstorageSecurityContext" . | nindent 10 }}
          {{- with include "firefox-sync.initResources" . }}{{ . | trim | nindent 10 }}{{ end }}
          # compose's script verbatim: Kubernetes, like compose, turns $$ into $
          command: ["/bin/sh", "-c"]
          # (FFS_BOTH_ENV_NAMES: compose's, of the old names of .env; never set here)
          args:
            - |
              if [ -n "$${FFS_BOTH_ENV_NAMES:-}" ]; then
                for p in $$FFS_BOTH_ENV_NAMES; do
                  echo "ERROR: $${p%%/*} and $${p#*/} are both set (in .env or in the environment docker compose runs in): run ./prepare_environment.sh --upgrade for .env, or unset $${p#*/} in your shell (docs/upgrading.md#renamed-settings)"
                done
                exit 1
              fi
              # the node the init container sets: not empty, not the placeholder of .env-example
              case "$${SYNC_TOKENSERVER__INIT_NODE_URL:-}" in
                ""|*"<REPLACE_WITH_"*) echo "ERROR: the public Sync URL (SYNC_PUBLIC_URL) is empty or still the placeholder of .env-example: set it in .env"; exit 1 ;;
              esac
              pid=
              for i in $$(seq 1 120); do
                # (re)start syncstorage-rs until the databases accept connections
                if [ -z "$$pid" ] || ! kill -0 $$pid 2> /dev/null; then
                  /app/bin/syncserver &
                  pid=$$!
                fi
                if curl -sf http://localhost:8000/__heartbeat__ > /dev/null; then
                  # it answers once the migrations ran. Its graceful shutdown can hang for good
                  # (workers that never stop): killed 30 s after SIGTERM
                  kill $$pid
                  (sleep 30; kill -0 $$pid 2> /dev/null && echo "syncstorage-rs still running 30 s after SIGTERM, killed" && kill -9 $$pid) &
                  wait $$pid
                  kill $$! 2> /dev/null
                  echo "Migrations completed"
                  exit 0
                fi
                sleep 1
              done
              echo "Timeout waiting for syncstorage-rs to start"
              kill $$pid
              exit 1
        # compose's tokenserver_db_init: MAX_USERS and the sign-up trigger
        - name: db-init
          image: {{ include "firefox-sync.image" (dict "root" . "name" "init") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "firefox-sync.noEscalation" . | nindent 10 }}
          {{- with include "firefox-sync.initResources" . }}{{ . | trim | nindent 10 }}{{ end }}
          env:
            {{- if eq $backend "postgres" }}
            {{- $ts := dict "root" . "db" "tokenserver" }}
            - name: POSTGRES_SERVER
              value: {{ include "firefox-sync.dbHost" $ts | quote }}
            - name: POSTGRES_SERVER_PORT
              value: {{ $port | quote }}
            - name: POSTGRES_DATABASE
              value: {{ include "firefox-sync.dbName" $ts | quote }}
            - name: POSTGRES_USER
              value: {{ include "firefox-sync.dbUser" $ts | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- else }}
            {{- $ts := dict "root" . "db" "tokenserver" }}
            - name: MARIADB_SERVER
              value: {{ include "firefox-sync.dbHost" $ts | quote }}
            - name: MARIADB_SERVER_PORT
              value: {{ $port | quote }}
            - name: MARIADB_DATABASE
              value: {{ include "firefox-sync.dbName" $ts | quote }}
            - name: MARIADB_USER
              value: {{ include "firefox-sync.dbUser" $ts | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "MARIADB_PASSWORD" "key" "TOKENSERVER_DB_PASSWORD") | nindent 12 }}
            - name: MARIADB_TLS_VERIFY
              value: {{ include "firefox-sync.tlsVerify" . | quote }}
            {{- end }}
            - name: MAX_USERS
              value: {{ include "firefox-sync.maxUsers" . | quote }}
            - name: DOMAIN
              value: {{ .Values.syncDomain | quote }}
            {{- if eq $backend "postgres" }}
            {{- include "firefox-sync.postgresSyncEnv" . | nindent 12 }}
            - name: ADMIN_DB_USER
              value: {{ include "firefox-sync.adminDbUser" . }}
            - name: ADMIN_DB_SYNC_USER
              value: {{ include "firefox-sync.adminDbSyncUser" . }}
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "ADMIN_DB_PASSWORD" "key" "ADMIN_DB_PASSWORD") | nindent 12 }}
            - name: ADMIN_DB_NAME
              value: {{ include "firefox-sync.adminDbName" . }}
            {{- end }}
      containers:
        - name: syncstorage
          image: {{ include "firefox-sync.image" (dict "root" . "name" "syncstorage") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/bin/syncserver"]
          {{- include "firefox-sync.syncstorageSecurityContext" . | nindent 10 }}
          env:
            {{- include "firefox-sync.syncstorageEnv" . | nindent 12 }}
            {{- if .Values.admin.enabled }}
            # compose's entrypoint: the metrics to the admin UI only while it runs, syncstorage-rs
            # does not start when the statsd host does not resolve (the Service's name does,
            # from before this pod: Helm creates Services first)
            - name: SYNC_STATSD_HOST
              value: {{ include "firefox-sync.adminService" . }}
            - name: SYNC_STATSD_PORT
              value: "8125"
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /__heartbeat__
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          # compose's healthcheck
          livenessProbe:
            httpGet:
              path: /__heartbeat__
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          {{- with .Values.syncstorage.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if not .Values.database.bundled }}
      volumes:
        {{- include "firefox-sync.dbSetupVolume" (dict "root" . "scope" "sync") | nindent 8 }}
      {{- end }}
