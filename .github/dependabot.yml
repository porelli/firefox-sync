# Dependabot's version updates, weekly. Its pull requests go through the gate of
# .github/workflows/dependencies.yml: semver minor and patch updates are merged once CI passed,
# major ones (and actions pinned by commit) stay open for a human. See
# docs/development/dependencies.md: why these ecosystems and not the others (the images'
# base tags, docs/requirements.txt), and how to turn it off.
version: 2
updates:
  # the admin UI's Go modules
  - package-ecosystem: gomod
    directory: /admin
    schedule:
      interval: weekly
      # not on Monday: the weekly image builds and the release run then
      day: wednesday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      # one pull request for the minor and patch updates; each major one its own
      admin-go:
        patterns: ["*"]
        update-types: [minor, patch]
    # fix(deps): bump ...
    commit-message:
      prefix: fix
      include: scope

  # the actions of the workflows and of the composite actions, by major tag (@v7): a new major
  # is a pull request of its own, left for a human; the azure/setup-helm commit pin of
  # helm.yml's publish job moves with its releases, also left for a human
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    # ci(deps): bump ...
    commit-message:
      prefix: ci
      include: scope
