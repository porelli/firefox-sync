name: helm

# The Helm chart (charts/firefox-sync): lint, parity with compose, and an install on a
# throwaway kind cluster per database backend, on its own database server too (tests/helm.sh),
# and with the self-hosted accounts per accounts database (tests/helm-fxa.sh); one of each on arm64.
# The init and admin images are built from this commit (tests/helm.sh does it, and kind loads
# them), the syncstorage images are this repository's published ones.
# Publishing: on a tag chart-v<version> (the version of Chart.yaml), after every test passed,
# the chart is pushed to oci://ghcr.io/<owner>/<repository>/charts/firefox-sync, lowercase: a
# package of this repository's own, which no other repository (the dev one) shares, next to
# its images (not oci://ghcr.io/<owner>/<repository>: that is the image package). The job
# version checks the tag first (.github/scripts/chart-version.sh): a stable version only from
# a commit of the default branch; a pre-release (x.y.z-<suffix>, e.g. 0.1.0-dev.1) from any
# branch, to test the publishing (helm install without --version or --devel never picks a
# pre-release). A version is published once: never replaced. Chart.yaml's annotation
# org.firefox-sync/chart is set to this address (the admin UI's helm commands show it).
# Branch pushes and the weekly run build and test only.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1' # every Monday, after the syncstorage-rs and fxa-mono builds
  push:
    branches:
      - '**'
    # (path filters do not apply to tags: a chart-v tag always runs)
    tags:
      - 'chart-v*'
    paths:
      - charts/**
      - tests/helm*
      - tests/helm/**
      - tests/test_client_flow.py
      - tests/test_fxa_*.py
      - tests/browser/**
      - config/fxa/**
      - .env-example
      - tests/compose/admin-build.yml
      - docker-compose.yml
      - compose/**
      - db/**
      - config/backup/**
      - admin/**
      # tests/helm.sh runs the restore commands of docs/backups.md
      - docs/backups.md
      - .github/workflows/helm.yml
      - .github/scripts/chart-version.sh
      - .github/scripts/chart-unpublished.sh

# one run at a time per branch (and tag): a branch never cancels or waits for main's runs. A
# newer push to a branch cancels its older run; main's runs and tags' always finish
concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REPOSITORY_REGISTRY: ghcr.io
  REPOSITORY_FULL_NAME: ${{ github.repository }}
  CHART_DIR: charts/firefox-sync

jobs:
  ## the version of Chart.yaml; on a chart-v tag, a mistyped or misplaced tag fails here, first ##
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.tools.outputs.kind }}
      kubectl: ${{ steps.tools.outputs.kubectl }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the default branch's history: is the tagged commit on it
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/chart-v') && '0' || '1' }}

      - name: The tag is chart-v and Chart.yaml's version, stable ones from the default branch
        id: version
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/chart-v') && github.ref_name || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -n "${TAG}" ]]; then
            .github/scripts/chart-version.sh "${CHART_DIR}" "${TAG}" "origin/${DEFAULT_BRANCH}" > version.txt
          else
            .github/scripts/chart-version.sh "${CHART_DIR}" > version.txt
          fi
          cat version.txt >> "${GITHUB_OUTPUT}"
          cat version.txt

      - name: The latest kind and kubectl
        # helm/kind-action installs its own release's defaults otherwise: the newest releases,
        # for every job of the run (Helm is azure/setup-helm's latest, chart-testing its defaults)
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$(gh api repos/kubernetes-sigs/kind/releases/latest --jq .tag_name)
          kubectl=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          [[ "${kind}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "${kubectl}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::no kind (${kind}) or kubectl (${kubectl}) version"; exit 1; }
          echo "kind ${kind}, kubectl ${kubectl}"
          { echo "kind=${kind}"; echo "kubectl=${kubectl}"; } >> "${GITHUB_OUTPUT}"

  ## ct lint, kubeconform, tests/helm.sh lint (its template checks, then parity with compose) ##
  lint:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the whole history: tests/helm-fxa.sh renders chart 0.1.0 (git archive of its
          # commit) to compare with the accounts off
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up chart-testing
        # (its defaults: the chart-testing, yamllint and yamale of its latest release)
        uses: helm/chart-testing-action@v2

      - name: Install kubeconform and PyYAML
        # (python3 is now the venv of chart-testing, VIRTUAL_ENV: PyYAML for tests/helm.sh in it)
        # kubeconform: its latest release, checked against that release's CHECKSUMS. It publishes
        # no signature or attestation: the checksum only guards against a corrupt download, and
        # this job's token is read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/yannh/kubeconform/releases/latest --jq .tag_name)
          echo "kubeconform ${tag}"
          mkdir -p /tmp/kubeconform "${RUNNER_TEMP}/bin"
          cd /tmp/kubeconform
          for f in CHECKSUMS kubeconform-linux-amd64.tar.gz; do
            curl -fsSL -o "${f}" "https://github.com/yannh/kubeconform/releases/download/${tag}/${f}"
          done
          grep -E '^[0-9a-f]{64} +kubeconform-linux-amd64\.tar\.gz$' CHECKSUMS | sha256sum -c --strict
          tar -xzf kubeconform-linux-amd64.tar.gz -C "${RUNNER_TEMP}/bin" kubeconform
          cd - > /dev/null
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          uv pip install pyyaml
          python3 -I -c 'import yaml'
          docker compose version

      - name: ct lint
        # the version is checked when publishing (a run on main would compare the chart with
        # itself); the maintainers are not GitHub user names
        run: ct lint --charts "${CHART_DIR}" --check-version-increment=false --validate-maintainers=false

      - name: kubeconform (ci/*.yaml)
        run: |
          for values in "${CHART_DIR}"/ci/*.yaml; do
            echo "== ${values}"
            helm template test-release "${CHART_DIR}" -f "${values}" | kubeconform -strict -summary -kubernetes-version 1.29.0
          done

      - name: tests/helm.sh lint (and parity)
        run: ./tests/helm.sh lint

  ## the chart on kind: mock FxA, a Firefox client's flow, upgrades, backups, the admin UI ##
  e2e:
    needs: version
    # GitHub has no -latest label for arm (actions/runner-images): the newest Ubuntu
    # the heavy jobs: self-hosted runners labelled ffs-ec2 with FFS_RUNNERS=ec2, GitHub's otherwise
    runs-on: ${{ vars.FFS_RUNNERS == 'ec2' && fromJSON(matrix.arch == 'arm64' && '["self-hosted","ffs-ec2","linux","ARM64"]' || '["self-hosted","ffs-ec2","linux","X64"]') || (matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest') }}
    permissions:
      contents: read
      # this repository's syncstorage images (private ones too)
      packages: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [mariadb, mysql, postgres]
        # 1: on a database server of its own in the cluster (database.bundled=false)
        external_db: ["", "1"]
        arch: [amd64]
        exclude:
          # (EXTERNAL_DB=1: MySQL lts or PostgreSQL latest, as tests/e2e.sh)
          - backend: mariadb
            external_db: "1"
        include:
          # once on arm64: the chart's images and kind there
          - backend: postgres
            external_db: ""
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up kind and kubectl
        # (tests/helm.sh creates and deletes its cluster)
        uses: helm/kind-action@v1
        with:
          version: ${{ needs.version.outputs.kind }}
          kubectl_version: ${{ needs.version.outputs.kubectl }}
          install_only: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable the runner's AppArmor profile of MySQL
        # the runner's own MySQL server's profile (/usr/sbin/mysqld) would also confine the
        # mysqld of the mysql image in kind, whose pods run unconfined: no /etc/my.cnf, no
        # init file, the first start aborts (tests/helm.sh fails early while it is enabled)
        if: matrix.backend == 'mysql'
        run: |
          if [[ -e /etc/apparmor.d/usr.sbin.mysqld ]]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          fi
          sudo grep mysqld /sys/kernel/security/apparmor/profiles && exit 1 || echo "no mysqld profile loaded"

      - name: End-to-end on kind (${{ matrix.backend }}${{ matrix.external_db && ', your own database server' || '' }}, ${{ matrix.arch }})
        # the init image (db/<engine>/init) and the admin UI (admin/) are built from this
        # commit on every run (whatever changed) and kind-loaded by tests/helm.sh; the
        # syncstorage image is REPOSITORY's, pulled here and imported into the cluster
        env:
          TAG: latest
          BACKEND: ${{ matrix.backend }}
          EXTERNAL_DB: ${{ matrix.external_db }}
          # your own MySQL server: the chart applies its SQL itself (database.external.bootstrap.user;
          # PostgreSQL: checked only), docs/databases.md#let-the-stack-apply-them
          DB_BOOTSTRAP: ${{ matrix.external_db == '1' && matrix.backend == 'mysql' && '1' || '' }}
        # (an image reference is lowercase)
        run: REPOSITORY="${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME,,}" ./tests/helm.sh e2e "${BACKEND}"

  ## the chart with the self-hosted accounts on kind (tests/helm-fxa.sh), per accounts database ##
  e2e-fxa:
    needs: version
    name: e2e-fxa (${{ matrix.config }}, ${{ matrix.part }})
    # (arm64 as in e2e)
    runs-on: ${{ vars.FFS_RUNNERS == 'ec2' && fromJSON(matrix.arch == 'arm64' && '["self-hosted","ffs-ec2","linux","ARM64"]' || '["self-hosted","ffs-ec2","linux","X64"]') || (matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest') }}
    permissions:
      contents: read
      # this repository's accounts and syncstorage images
      packages: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # tests/helm-fxa.sh's two parts (PART), each on a runner of its own: the whole e2e on
        # one cluster takes about 30 minutes; main is the install's checks, fail closed, the
        # flows, the admin UI, the backups and Firefox, survival what follows an upgrade
        part: [main, survival]
        config: [mysql, mariadb, mysql-extdb, mysql-sync-postgres, mysql-arm64]
        exclude:
          # (your own server: no survival part, as tests/helm-fxa.sh)
          - config: mysql-extdb
            part: survival
        include:
          - config: mysql
            fxa_db: mysql
          # (the real Firefox runs once, on MySQL: about 1 GB of image and 10 minutes)
          - config: mariadb
            fxa_db: mariadb
            skip_browser: "1"
          - config: mysql-extdb
            fxa_db: mysql
            external_db: "1"
            skip_browser: "1"
          # the Sync server on PostgreSQL next to the accounts (MySQL): the backups of both
          # scopes, the restores of docs/backups.md#restore-on-kubernetes for each
          - config: mysql-sync-postgres
            fxa_db: mysql
            sync_backend: postgres
            skip_browser: "1"
          # once on arm64, with Firefox (tests/browser builds for arm64 too)
          - config: mysql-arm64
            fxa_db: mysql
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space
        # the accounts image (about 5 GB) in docker and again in the kind node: the e2e
        # checks for 15 GB plus the Firefox image. The runners have several times that now,
        # and removing these takes up to 3 minutes: only when there is less than 40 GB
        run: |
          if (( $(df -BG --output=avail / | tail -1 | tr -dc 0-9) < 40 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up kind and kubectl
        uses: helm/kind-action@v1
        with:
          version: ${{ needs.version.outputs.kind }}
          kubectl_version: ${{ needs.version.outputs.kubectl }}
          install_only: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable the runner's AppArmor profile of MySQL
        # as in e2e: the runner's mysqld profile would confine the mysql image's mysqld in kind
        if: matrix.fxa_db == 'mysql'
        run: |
          if [[ -e /etc/apparmor.d/usr.sbin.mysqld ]]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          fi
          sudo grep mysqld /sys/kernel/security/apparmor/profiles && exit 1 || echo "no mysqld profile loaded"

      - name: The accounts on kind (${{ matrix.fxa_db }}${{ matrix.external_db && ', your own database server' || '' }}${{ matrix.sync_backend && format(', Sync on {0}', matrix.sync_backend) || '' }}${{ matrix.arch && format(', {0}', matrix.arch) || '' }}, part ${{ matrix.part }})
        env:
          PART: ${{ matrix.part }}
          FXA_DB: ${{ matrix.fxa_db }}
          EXTERNAL_DB: ${{ matrix.external_db }}
          SYNC_BACKEND: ${{ matrix.sync_backend }}
          SKIP_BROWSER: ${{ matrix.skip_browser }}
        # (an image reference is lowercase)
        run: REPOSITORY="${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME,,}" ./tests/helm-fxa.sh e2e "${FXA_DB}"

  ## oci://ghcr.io/<owner>/<repository>/charts/firefox-sync:<version>, on chart-v<version> tags ##
  publish:
    needs: [version, lint, e2e, e2e-fxa]
    if: startsWith(github.ref, 'refs/tags/chart-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    env:
      PUBLISH_HELM_VERSION: v4.3.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        # by commit (v5.0.1), in this job alone: it runs with packages: write, a moved tag
        # of a third-party action must not reach the token that publishes (the other jobs
        # keep the tags, as the repository's other workflows)
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.PUBLISH_HELM_VERSION }}

      - name: The Helm that publishes is the release's binary
        # a security pin, as the action's commit: the job holds a token that writes packages, so
        # its Helm is a fixed version checked against that release's sha256 (get.helm.sh and the
        # release notes give the same), which the action itself does not check. The other jobs
        # test with the latest Helm; move this one to a version they tested.
        env:
          PUBLISH_HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          d=$(mktemp -d)
          curl -fsSL -o "${d}/helm.tar.gz" "https://get.helm.sh/helm-${PUBLISH_HELM_VERSION}-linux-amd64.tar.gz"
          echo "${PUBLISH_HELM_SHA256}  ${d}/helm.tar.gz" | sha256sum -c --strict
          tar -xzf "${d}/helm.tar.gz" -C "${d}" linux-amd64/helm
          cmp "${d}/linux-amd64/helm" "$(command -v helm)"
          helm version

      - name: Where the chart is published
        # Chart.yaml's annotation (the public repository's in the tree), which the admin UI's
        # helm upgrade commands show (ADMIN_K8S_CHART): this repository's
        run: |
          chart="oci://${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME,,}/charts"
          echo "CHART_REGISTRY=${chart}" >> "${GITHUB_ENV}"
          sed -i "s|^  org.firefox-sync/chart: .*|  org.firefox-sync/chart: ${chart}/firefox-sync|" "${CHART_DIR}/Chart.yaml"
          helm show chart "${CHART_DIR}" | grep -Fx "  org.firefox-sync/chart: ${chart}/firefox-sync"

      - name: Package
        # appVersion: the syncstorage-rs release the chart's default images (latest) run when it
        # is published, the newest syncstorage-rs-mysql-X.Y.Z tag of this repository's package
        # (Chart.yaml names none: a version kept there would go stale with Mozilla's next release)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_version=$(.github/scripts/sync-app-version.sh "${REPOSITORY_REGISTRY}" "${REPOSITORY_FULL_NAME}")
          echo "appVersion ${app_version}"
          helm package --app-version "${app_version}" "${CHART_DIR}"

      - name: Push
        # a version once only: a release never changes under the same version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login "${REPOSITORY_REGISTRY}" -u "${ACTOR}" --password-stdin <<< "${TOKEN}"
          # fails closed: only the registry's clear not found lets it push
          .github/scripts/chart-unpublished.sh "${CHART_REGISTRY}/firefox-sync" "${VERSION}"
          helm push "firefox-sync-${VERSION}.tgz" "${CHART_REGISTRY}"
          helm show chart "${CHART_REGISTRY}/firefox-sync" --version "${VERSION}"
