name: syncstorage-rs-mysql

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild all images from scratch instead of reusing identical ones (scheduled runs, and releases, a tagged commit on main, always do)
        type: boolean
        default: false
      fxa_version:
        description: "mozilla/fxa-mono tag for the self-hosted accounts tests, default: newest release"
        type: string
        default: ""
  schedule:
    - cron: '15 6 * * 1' # Run every Monday at 06:15 UTC
    # - cron: '*/7 * * * *' # Test
  push:
    branches:
      - main
      - '**'
    # docs only: no image to rebuild, but docs/backups.md, docs/upgrading.md and docs/migrating.md,
    # whose commands tests/e2e.sh and tests/podman.sh run (paths-ignore cannot negate, so the pages are listed)
    paths-ignore:
      - '**/README.md'
      - 'docs/admin/**'
      - 'docs/install/**'
      - 'docs/development/**'
      - 'docs/reference/**'
      - 'docs/images/**'
      - 'docs/accounts.md'
      - 'docs/databases.md'
      - 'docs/firefox.md'
      - 'docs/limits.md'
      - 'docs/reverse-proxy.md'
      - 'docs/troubleshooting.md'
      - '.github/workflows/docs.yml'
      - 'tests/check_markdown_links.py'
      - 'tests/test_check_markdown_links.py'
      - 'mkdocs.yml'
      - 'docs/hooks/**'
      - 'docs/requirements.txt'
      - 'tests/check_site_anchors.py'
      # the local VM's script (docs/development/testing.md#local-vm): CI does not run it
      - 'tests/vm/**'

# one run at a time per branch: a branch never cancels or waits for main's runs
concurrency:
  group: syncstorage-rs-${{ github.ref }}
  cancel-in-progress: false

env:
  # repository variables
  REPOSITORY_REGISTRY: ghcr.io
  REPOSITORY_FULL_NAME: ${{ github.repository }}
  REPOSITORY_MAIN_BRANCH: main
  # service variables
  SERVICE_NAME: syncstorage-rs
  SERVICE_REPOSITORY_SERVER: github.com
  SERVICE_REPOSITORY_NAME: mozilla-services/syncstorage-rs
  SERVICE_CHANGELOG_PATH: CHANGELOG.md # upstream's file (check-links: ignore)
  # specific for this component (image tags used to name the GitHub release)
  IMAGE_TAGS: mysql
  # bump when the way the app image is built changes (build args, platforms, ...):
  # app images are otherwise reused as long as the upstream tag does not change
  APP_BUILD_REVISION: 2

jobs:

  ## Set common libraries ##
  prepare-env:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      github_release: ${{ steps.set-version-suffix-and-release-strategy.outputs.github_release }}
      service_tag: ${{ steps.get-service-latest-tag.outputs.service_tag }}
      internal_commit_head: ${{ steps.find-code.outputs.internal_commit_head }}
      build_date: ${{ steps.build_date.outputs.build_date }}
      patches_obsolete: ${{ steps.patches.outputs.obsolete_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find local code to build
        id: find-code
        uses: ./.github/actions/find-head
        with:
          event_name: ${{ github.event_name }}
          repository_main_branch: ${{ env.REPOSITORY_MAIN_BRANCH }}

      - name: Decide release strategy
        id: set-version-suffix-and-release-strategy
        # <GIT_BRANCH>   , <GIT_TAG> on head, github release
        # main           , yes              , yes
        # non-main-branch, yes              , no
        # any-branch     , no               , no
        run: |
          if [[ "${{ steps.find-code.outputs.internal_commit_branch_name }}" == ${{ env.REPOSITORY_MAIN_BRANCH }} ]] && [[ "${{ steps.find-code.outputs.internal_commit_tag }}" != "" ]]; then
            echo 'github_release=true' >> ${GITHUB_OUTPUT}
          else
            echo 'github_release=false' >> ${GITHUB_OUTPUT}
          fi

      - name: Fetch latest tags from service repository
        id: get-service-latest-tag
        run: |
          latest_tag=$(git ls-remote --tags "https://${{ env.SERVICE_REPOSITORY_SERVER }}/${{ env.SERVICE_REPOSITORY_NAME }}" | grep -v '\^{}' | awk -F/ '{print $NF}' | sort -V | tail -n1)
          echo "Latest tag for this service: ${latest_tag}"
          echo "service_tag=${latest_tag}" >> ${GITHUB_OUTPUT}

      - name: Unit tests of the upstream patches script
        run: python3 tests/test_upstream_patches.py

      # the pull requests of upstream-patches.yml for the app images: a closed one fails here
      - name: Upstream patches for the release
        id: patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upstream-patches.py plan syncstorage-rs "${{ steps.get-service-latest-tag.outputs.service_tag }}"

      - name: Set current date as env variable
        id: build_date
        run: echo "build_date=$(date +'%Y%m%dT%H%M%S')" >> ${GITHUB_OUTPUT}

  # Remove old build cache ##
  cleanup-registry:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Clean old build cache
        if: github.event_name == 'schedule'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: false
          older-than: 6 days
          use-regex: true
          delete-tags: buildcache-*

  ## Build containers for all platforms ##
  build-and-push-containers:
    needs:
      - prepare-env
      - cleanup-registry

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        database_backend: [mysql, postgres]
        image_type: [app, init]
        docker_architecture: [amd64, arm64]
        include:
          - docker_architecture: amd64
            github_runner_image: ubuntu-latest
          - docker_architecture: arm64
            # GitHub has no -latest label for arm (actions/runner-images): the newest Ubuntu
            github_runner_image: ubuntu-26.04-arm

    runs-on: ${{ matrix.github_runner_image }}

    steps:
      - name: Prepare variables
        id: prepare-variables
        run: |
          # setting docker and github variables
          case ${{ matrix.docker_architecture }} in
            amd64)
              echo docker_architecture='amd64' >> ${GITHUB_OUTPUT}
              echo docker_target='linux/amd64' >> ${GITHUB_OUTPUT}
              ;;
            arm64)
              echo docker_architecture='arm64' >> ${GITHUB_OUTPUT}
              echo docker_target='linux/arm64' >> ${GITHUB_OUTPUT}
              ;;
            *)
              echo "Unknown architecture"
              exit 1
              ;;
          esac

          # setting image-specific paths
          case ${{ matrix.image_type }} in
            app)
              echo code_repository="${{ env.SERVICE_REPOSITORY_NAME }}" >> ${GITHUB_OUTPUT}
              echo code_dockerfile_path='./' >> ${GITHUB_OUTPUT}
              echo code_commit_head="${{ needs.prepare-env.outputs.service_tag }}" >> ${GITHUB_OUTPUT}
              ;;
            *)
              echo code_repository="${{ env.REPOSITORY_FULL_NAME }}" >> ${GITHUB_OUTPUT}
              # db/mysql/init (MariaDB and MySQL), db/postgres/init
              echo code_dockerfile_path="./db/${{ matrix.database_backend }}/${{ matrix.image_type }}/" >> ${GITHUB_OUTPUT}
              echo code_commit_head="${{ needs.prepare-env.outputs.internal_commit_head }}" >> ${GITHUB_OUTPUT}
              ;;
          esac

      - name: Prepare platform pair
        id: prepare-platform-pair
        run: |
          platform=${{ steps.prepare-variables.outputs.docker_target }}
          echo "platform_pair=${platform//\//-}" >> ${GITHUB_OUTPUT}

      - name: Checkout workflows
        uses: actions/checkout@v7
        with:
          path: workflows
          persist-credentials: false

      - name: Prepare image name
        id: image_name
        uses: ./workflows/.github/actions/image-name-suffix
        with:
          image_type: ${{ matrix.image_type }}
          image_tags: ${{ matrix.database_backend }}
          # service_tag: ${{ needs.prepare-env.outputs.service_tag }}
          # platform_pair: ${{ steps.prepare-platform-pair.outputs.platform_pair }}

      - name: Clean workflows
        run: |
          rm -Rf ./workflows

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.prepare-variables.outputs.code_commit_head }}
          repository: ${{ steps.prepare-variables.outputs.code_repository }}
          # the token stays off the disk of upstream's sources (the build has no credentials)
          persist-credentials: false

      - name: Checkout upstream-patches.yml
        if: matrix.image_type == 'app'
        uses: actions/checkout@v7
        with:
          path: ffs
          persist-credentials: false
          sparse-checkout: |
            upstream-patches.yml
            upstream-patches/
            .github/scripts/upstream-patches.py
          sparse-checkout-cone-mode: false

      # the pull requests of upstream-patches.yml, into the label org.firefox-sync.upstream-patches
      - name: Apply the upstream patches
        id: patches
        if: matrix.image_type == 'app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ffs/.github/scripts/upstream-patches.py apply syncstorage-rs "${{ needs.prepare-env.outputs.service_tag }}" .
          # not in the image
          rm -rf ffs
          git status --short

      # for the job upstream-patches: a patch found already in the sources is obsolete too
      - name: Export the obsolete upstream patches
        if: matrix.image_type == 'app'
        env:
          OBSOLETE: ${{ steps.patches.outputs.obsolete_json }}
        run: |
          mkdir -p "${RUNNER_TEMP}/upstream-patches"
          printf '%s\n' "${OBSOLETE:-[]}" > "${RUNNER_TEMP}/upstream-patches/obsolete.json"

      - name: Upload the obsolete upstream patches
        if: matrix.image_type == 'app'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-patches-${{ matrix.database_backend }}-${{ steps.prepare-platform-pair.outputs.platform_pair }}
          path: ${{ runner.temp }}/upstream-patches/obsolete.json
          if-no-files-found: error
          retention-days: 1

      - name: Version of the app
        if: matrix.image_type == 'app'
        env:
          SERVICE_TAG: ${{ needs.prepare-env.outputs.service_tag }}
        run: |
          # upstream's CI fills version.json (served at /__version__), it says TBD otherwise
          printf '{"version":"%s","commit":"%s","source":"https://github.com/%s","build":"%s/%s/actions/runs/%s"}\n' \
            "${SERVICE_TAG}" "$(git rev-parse HEAD)" "${{ env.SERVICE_REPOSITORY_NAME }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" | tee version.json

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          tags: |
            type=pep440,pattern={{version}},value=${{ needs.prepare-env.outputs.service_tag }}
          flavor: |
            latest=false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Look for an identical image
        id: reuse
        run: |
          # the key only changes when the inputs of the image change: the upstream tag and
          # the upstream patches applied for the app, the content of its directory in this
          # repository for the init image
          if [ "${{ matrix.image_type }}" = app ]; then
            key="${{ needs.prepare-env.outputs.service_tag }}-r${{ env.APP_BUILD_REVISION }}-p${{ steps.patches.outputs.key }}"
          else
            dir="${{ steps.prepare-variables.outputs.code_dockerfile_path }}"
            dir=${dir#./}
            key="src-$(git rev-parse --short=12 "HEAD:${dir%/}")"
          fi
          # main's tags (the key tags it reuses, the per-architecture tags, the build cache) are
          # written by main only: a branch gets key tags of its own and only the dated tag
          prefix="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.SERVICE_NAME }}-${{ steps.image_name.outputs.docker_image_name_suffix }}"
          pair="${{ steps.prepare-platform-pair.outputs.platform_pair }}"
          if [ "${GITHUB_REF}" = "refs/heads/${{ env.REPOSITORY_MAIN_BRANCH }}" ]; then
            scope=""
          else
            scope="-ref-$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-40)"
          fi
          key_tag="${prefix}-key-${key}${scope}-${pair}"
          echo "key_tag=${key_tag}" >> "${GITHUB_OUTPUT}"
          tags="${prefix}-${{ needs.prepare-env.outputs.service_tag }}-${{ needs.prepare-env.outputs.build_date }}-${pair}"
          if [ -z "${scope}" ]; then
            tags="${tags},${prefix}-${{ needs.prepare-env.outputs.service_tag }}-${pair},${prefix}-${pair}-latest"
            echo "cache_to=type=registry,ref=${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:buildcache-${{ env.SERVICE_NAME }}-${{ steps.image_name.outputs.docker_image_name_suffix }}-${{ needs.prepare-env.outputs.service_tag }}-${pair},mode=max" >> "${GITHUB_OUTPUT}"
          fi
          echo "tags=${tags},${key_tag}" >> "${GITHUB_OUTPUT}"

          # scheduled builds, releases and manual rebuilds start from scratch to pick up
          # base image (security) updates
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.rebuild }}" = true ] || [ "${{ needs.prepare-env.outputs.github_release }}" = true ]; then
            echo "Fresh build (${{ github.event_name }})"
            echo "fresh=true" >> ${GITHUB_OUTPUT}
          elif digest=$(docker buildx imagetools inspect "${key_tag}" --format '{{json .Manifest}}' 2> /dev/null | jq -r .digest) && [ -n "${digest}" ]; then
            echo "Reusing ${key_tag} (${digest})"
            echo "digest=${digest}" >> ${GITHUB_OUTPUT}
          else
            echo "No image for ${key_tag}, building it"
          fi

      - name: Tag the identical image
        if: steps.reuse.outputs.digest != ''
        env:
          TAGS: ${{ steps.reuse.outputs.tags }}
          KEY_TAG: ${{ steps.reuse.outputs.key_tag }}
        run: |
          args=()
          IFS=, read -r -a tags <<< "${TAGS}"
          for t in "${tags[@]}"; do [ "${t}" = "${KEY_TAG}" ] || args+=(-t "${t}"); done
          docker buildx imagetools create "${args[@]}" "${KEY_TAG}"

      - name: Build and push
        id: build
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ steps.prepare-variables.outputs.docker_target }}
          tags: ${{ steps.reuse.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ matrix.image_type == 'app' && format('org.firefox-sync.upstream-patches={0}', steps.patches.outputs.label) || '' }}
          no-cache: ${{ steps.reuse.outputs.fresh == 'true' }}
          outputs: type=image,"name=${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}",name-canonical=true,push=true
          context: ${{ steps.prepare-variables.outputs.code_dockerfile_path }}
          build-args: |
            DATABASE_BACKEND=${{ matrix.database_backend }}
            SYNCSTORAGE_DATABASE_BACKEND=${{ matrix.database_backend }}
            TOKENSERVER_DATABASE_BACKEND=${{ matrix.database_backend }}
          cache-from: type=registry,ref=${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:buildcache-${{ env.SERVICE_NAME }}-${{ steps.image_name.outputs.docker_image_name_suffix }}-${{ needs.prepare-env.outputs.service_tag }}-${{ steps.prepare-platform-pair.outputs.platform_pair }}
          # main only (empty on branches: no cache written)
          cache-to: ${{ steps.reuse.outputs.cache_to }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest || steps.reuse.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.database_backend }}-${{ matrix.image_type }}-${{ steps.prepare-platform-pair.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  ## Test the amd64 images before publishing the multi-arch tags ##
  test:
    needs:
      - prepare-env
      - build-and-push-containers

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        database_backend: [mysql, postgres]
        # 1: on a database server outside the stack, with only the grants of docs/reference/database-users.md
        external_db: ["", "1"]
        # the database containers: mariadb (lts), or mysql (SYNC_DB=mysql) for the mysql backend
        sync_db: [mariadb]
        # the MySQL of sync_db mysql and of the external server of the mysql backend: empty is
        # mysql:lts (the default), mysql:8 the installs from before (pinned by --upgrade;
        # tests/e2e.sh also checks there that lts refuses their data, and moves them to lts)
        mysql_image: [""]
        # 1: postgres only, the install on the major before postgres:latest's, moved to it with
        # the dump and restore of docs/upgrading.md#postgresql (PG_MAJOR_MOVE)
        pg_major_move: [""]
        include:
          - database_backend: mysql
            external_db: ""
            sync_db: mysql
          - database_backend: mysql
            external_db: ""
            sync_db: mysql
            mysql_image: mysql:8
          - database_backend: mysql
            external_db: "1"
            sync_db: mariadb
            mysql_image: mysql:8
          - database_backend: postgres
            external_db: ""
            sync_db: mariadb
            pg_major_move: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: End-to-end tests${{ matrix.external_db && ' (your own database server)' || '' }}${{ matrix.sync_db == 'mysql' && ' (MySQL containers)' || '' }}${{ matrix.database_backend == 'mysql' && matrix.mysql_image && format(' ({0})', matrix.mysql_image) || '' }}${{ matrix.pg_major_move && ' (a PostgreSQL major move)' || '' }}
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: ${{ needs.prepare-env.outputs.service_tag }}-${{ needs.prepare-env.outputs.build_date }}-linux-amd64
          EXTERNAL_DB: ${{ matrix.external_db }}
          # your own MySQL lts server: the stack applies its SQL itself (MySQL 8 and PostgreSQL:
          # checked only; admin.yml has PostgreSQL the other way round), docs/databases.md#let-the-stack-apply-them
          DB_BOOTSTRAP: ${{ matrix.external_db == '1' && matrix.database_backend == 'mysql' && !matrix.mysql_image && '1' || '' }}
          SYNC_DB: ${{ matrix.sync_db }}
          SYNC_MYSQL_IMAGE: ${{ matrix.mysql_image }}
          PG_MAJOR_MOVE: ${{ matrix.pg_major_move }}
        run: ./tests/e2e.sh ${{ matrix.database_backend }}

  ## Test rootless podman (quadlets, docker compose on the Podman socket) ##
  test-podman:
    needs:
      - prepare-env
      - build-and-push-containers

    permissions:
      contents: read
      packages: read

    runs-on: ubuntu-latest
    timeout-minutes: 45

    # the defaults (Sync on MariaDB, the accounts on MySQL), Sync on MySQL and on PostgreSQL,
    # the accounts on MariaDB; every database on its lts (PostgreSQL: latest). Your own
    # database server (EXTERNAL_DB): MariaDB in an entry of its own, MySQL and PostgreSQL with
    # theirs. The moves of docs/upgrading.md for the Quadlets (*_FROM): from MySQL 8 with
    # sync-mysql (Sync and the accounts), from MariaDB 11 with fxa-mariadb, both to lts.
    # Without the accounts where their phase is the default's
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            sync_db: mariadb
          - variant: sync-mysql
            sync_db: mysql
            external_db: "1"
            sync_mysql_from: mysql:8
            fxa_mysql_from: mysql:8
          - variant: sync-postgres
            sync_db: postgres
            external_db: "1"
            skip_fxa: "1"
          # (the stack applying the SQL of your own server itself, docs/databases.md#let-the-stack-apply-them)
          - variant: external-mariadb
            sync_db: mariadb
            external_db: "1"
            db_bootstrap: "1"
            skip_fxa: "1"
          - variant: fxa-mariadb
            sync_db: mariadb
            fxa_db: mariadb
            fxa_mariadb_from: mariadb:11

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up rootless podman and a systemd user session
        run: |
          # Ubuntu 26.04's AppArmor profile of pasta refuses podman's signal (the script says more)
          .github/scripts/pasta-apparmor.sh
          sudo loginctl enable-linger "${USER}"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> ${GITHUB_ENV}
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> ${GITHUB_ENV}

      - name: Disable the runner's AppArmor profile of MySQL
        # the runner's own MySQL server's profile (/usr/sbin/mysqld) also confines the mysqld of
        # the mysql image in rootless Podman's containers: no /etc/my.cnf, nor its error messages,
        # and podman cannot stop it ("given PID did not die within timeout"), as in helm.yml
        if: matrix.sync_db == 'mysql'
        run: |
          if [[ -e /etc/apparmor.d/usr.sbin.mysqld ]]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          fi
          sudo grep mysqld /sys/kernel/security/apparmor/profiles && exit 1 || echo "no mysqld profile loaded"

      - name: Login to GitHub Container Registry
        # docker compose sends the docker CLI credentials to the Podman socket when pulling
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REPOSITORY_REGISTRY }} -u ${{ github.repository_owner }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REPOSITORY_REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

      - name: Podman tests
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: ${{ needs.prepare-env.outputs.service_tag }}-${{ needs.prepare-env.outputs.build_date }}-linux-amd64
          SYNC_DB: ${{ matrix.sync_db }}
          FXA_DB: ${{ matrix.fxa_db }}
          EXTERNAL_DB: ${{ matrix.external_db }}
          DB_BOOTSTRAP: ${{ matrix.db_bootstrap }}
          SYNC_MYSQL_FROM: ${{ matrix.sync_mysql_from }}
          FXA_MYSQL_FROM: ${{ matrix.fxa_mysql_from }}
          FXA_MARIADB_FROM: ${{ matrix.fxa_mariadb_from }}
          SKIP_FXA: ${{ matrix.skip_fxa }}
        run: ./tests/podman.sh

  ## Test the self-hosted Mozilla accounts (does not block publishing) ##
  test-fxa:
    needs:
      - prepare-env
      - build-and-push-containers

    permissions:
      contents: read
      packages: read

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the Mozilla accounts version
        id: fxa
        run: |
          # newest vX.Y.Z release that is already published on Docker Hub
          version="${{ inputs.fxa_version }}"
          if [ -z "${version}" ]; then
            for candidate in $(git ls-remote --tags https://github.com/mozilla/fxa 'refs/tags/v*' | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 3 | sort -rV); do
              if docker manifest inspect "mozilla/fxa-mono:${candidate}" > /dev/null 2>&1; then
                version=${candidate}
                break
              fi
            done
          fi
          echo "Testing mozilla/fxa-mono:${version}"
          echo "version=${version}" >> ${GITHUB_OUTPUT}

      - name: End-to-end tests with self-hosted Mozilla accounts
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: ${{ needs.prepare-env.outputs.service_tag }}-${{ needs.prepare-env.outputs.build_date }}-linux-amd64
          # Mozilla's own images: early warning about a new release before fxa.yml builds it
          # (without mozilla/fxa#21554: the accounts on mysql:8 with mysql_native_password, as
          # the installs from before)
          FXA_IMAGE: docker.io/mozilla/fxa-mono
          FXA_VERSION: ${{ steps.fxa.outputs.version }}
          FXA_ARCH: amd64
          FXA_PAIRING_IMAGE: docker.io/mozilla/channelserver:latest
        run: ./tests/e2e-fxa.sh

      # the page source and a screenshot of each Firefox window of a failed test_fxa_browser.py
      # (the directory tests/e2e-fxa.sh prints, kept only then; the job log has their text and form fields)
      - name: Upload the pages of the failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-pages-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ffs-browser-artifacts.*
          if-no-files-found: ignore
          retention-days: 7

  ## Collect digests from previus builds and create a single manifest ##
  build-and-push-manifests:
    needs:
      - prepare-env
      - build-and-push-containers
      - test
      - test-podman
    # the multi-arch tags from the default branch only: other branches build and test (an
    # unmerged pin in upstream-patches.yml never reaches them)
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        database_backend: [mysql, postgres]
        image_type: [app, init]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflows
        uses: actions/checkout@v7
        with:
          path: workflows
          persist-credentials: false

      - name: Prepare image name
        id: image_name
        uses: ./workflows/.github/actions/image-name-suffix
        with:
          image_type: ${{ matrix.image_type }}
          image_tags: ${{ matrix.database_backend }}

      - name: Clean workflows
        run: |
          rm -Rf ./workflows

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ matrix.database_backend }}-${{ matrix.image_type }}-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker tags
        id: docker_tags
        run: |
          prefix="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.SERVICE_NAME }}-${{ steps.image_name.outputs.docker_image_name_suffix }}"
          echo "docker_tags={ \"tags\": [ \"${prefix}-${{ needs.prepare-env.outputs.service_tag }}-${{ needs.prepare-env.outputs.build_date }}\", \"${prefix}-${{ needs.prepare-env.outputs.service_tag }}\", \"${prefix}-latest\" ] }" >> ${GITHUB_OUTPUT}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.docker_tags.outputs.docker_tags }}') \
            $(printf '${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.SERVICE_NAME }}-${{ steps.image_name.outputs.docker_image_name_suffix }}-latest

  ## Prepare GitHub release ##
  prepare-release:
    runs-on: ubuntu-latest

    needs:
      - prepare-env
      - build-and-push-containers
      - build-and-push-manifests

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout workflows
        uses: actions/checkout@v7
        with:
          path: workflows
          persist-credentials: false

      - name: Prepare image name
        id: image_name
        uses: ./workflows/.github/actions/image-name-suffix
        with:
          image_type: 'app'
          image_tags: ${{ env.IMAGE_TAGS }}
          service_tag: ${{ needs.prepare-env.outputs.service_tag }}

      - name: Clean workflows
        run: |
          rm -Rf ./workflows

      - name: Get changelog from service
        if: needs.prepare-env.outputs.github_release == 'true'
        run: |
          mkdir -p mozilla-services/${{ env.SERVICE_NAME }}
          curl -H 'Accept: application/vnd.github.v3.raw' -L -s https://github.com/mozilla-services/syncstorage-rs/raw/refs/tags/${{ needs.prepare-env.outputs.service_tag }}/CHANGELOG.md -o mozilla-services/${{ env.SERVICE_NAME }}/${{ env.SERVICE_CHANGELOG_PATH }}

      - name: Checkout repository history
        if: needs.prepare-env.outputs.github_release == 'true'
        uses: actions/checkout@v7
        with:
          path: repository
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release notes
        if: needs.prepare-env.outputs.github_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the previous release is the latest one, before this run creates a new one
          previous=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName 2> /dev/null || true)
          cd repository
          ./.github/scripts/release-notes.sh \
            "${{ needs.prepare-env.outputs.service_tag }}" \
            "${{ needs.prepare-env.outputs.build_date }}" \
            "../mozilla-services/${{ env.SERVICE_NAME }}/${{ env.SERVICE_CHANGELOG_PATH }}" \
            "${previous}" \
            "${{ github.repository }}" \
            "${{ github.server_url }}" > ../release-notes.md
          cat ../release-notes.md

      - name: Create Release
        if: needs.prepare-env.outputs.github_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.SERVICE_NAME }}
          tag: ${{ env.SERVICE_NAME }}-${{ steps.image_name.outputs.docker_image_name_suffix }}-${{ needs.prepare-env.outputs.build_date }}
          bodyFile: ./release-notes.md

  ## An entry of upstream-patches.yml in the release now (not applied any more) ##
  # red until it is removed and its when_released done; after publishing, not holding it back
  upstream-patches:
    needs:
      - prepare-env
      - build-and-push-containers
      - build-and-push-manifests
    if: ${{ !cancelled() && needs.prepare-env.result == 'success' }}
    permissions:
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: The obsolete upstream patches of the app builds
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/upstream-patches
          pattern: upstream-patches-*

      - name: Upstream patches in the release now
        env:
          PLANNED: ${{ needs.prepare-env.outputs.patches_obsolete }}
        run: |
          # the plan's, and those the builds found already in the sources
          OBSOLETE=$(cat <(printf '%s\n' "${PLANNED:-[]}") "${RUNNER_TEMP}"/upstream-patches/*/obsolete.json 2> /dev/null | jq -cs 'add | unique_by(.id)')
          if [ "$(jq length <<< "${OBSOLETE:-[]}")" = 0 ]; then
            echo "No entry of upstream-patches.yml for syncstorage-rs is in the release yet"
            exit 0
          fi
          jq -r '.[] | "::error title=Upstream patch released::\(.id), \(.pr) is in the release, no longer applied. Remove the entry from upstream-patches.yml and: \(.when_released)"' <<< "${OBSOLETE}"
          exit 1
