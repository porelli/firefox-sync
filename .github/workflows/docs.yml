name: docs
# The links of the documentation (tests/check_markdown_links.py): every relative link, #anchor
# and blob/main URL of the markdown files, and with --code the doc references of the code
# (the admin UI's help links, the scripts' messages, the chart's NOTES); the setup
# migrations against db/setup-manifest (tests/setup_migrations.sh); and the files the setup's
# questions write (tests/setup_output.sh), and the configuration of the reverse proxy
# (tests/proxy_render.sh: nginx, Caddy and Traefik read it). On every push, with no
# paths filter: it takes a few minutes and needs no image of ours. See docs/development/testing.md#links.
#
# The coverage of the docs (tests/check_docs_coverage.py): every Helm value, Prometheus
# metric, event and alert kind and setup check of the admin UI on its page. And on a push to
# another branch than the default one, a warning (never a failure) when it changes a feature
# but no docs, or no entry under Unreleased in CHANGELOG.md (tests/check_docs_changed.py). See
# docs/development/testing.md#docs-coverage.
#
# The docs site (mkdocs.yml): built with --strict on every push, so a broken link, a missing
# #anchor or a page left out of the nav fails here; published on GitHub Pages from main only.
# See docs/development/testing.md#docs-site.
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # (the commit before too: on main the released setup migrations are those of HEAD^)
          fetch-depth: 2
      - name: Self-test of the checker
        run: python3 -I tests/test_check_markdown_links.py
      - name: Links
        run: python3 -I tests/check_markdown_links.py --code --settings
      - name: Self-test of the coverage checks
        run: |
          python3 -I tests/test_check_docs_coverage.py
          python3 -I tests/test_check_docs_changed.py
      # the release decision and CHANGELOG.md's rewriting (docs/development/releasing.md#releases)
      - name: Self-test of the release script
        run: python3 -I tests/test_release.py
      - name: Docs coverage
        run: python3 -I tests/check_docs_coverage.py
      # the questions of prepare_environment.sh write what the setup before them wrote, for the
      # same choices (no container runtime: stubs, docs/development/testing.md)
      - name: Setup output
        run: bash tests/setup_output.sh
      # the configuration of the reverse proxy it writes into proxy/ (setup/proxy.sh): the same as
      # tests/proxy/<case>/, and read by nginx, Caddy and Traefik themselves (their latest images)
      - name: Reverse proxy configuration
        run: CONTAINERS=1 bash tests/proxy_render.sh
      # db/setup-manifest: every setup migration with its checksum, those of main unchanged
      # (docs/databases.md#setup-migrations)
      - name: Setup migrations
        run: |
          git fetch --no-tags --depth=50 origin main:refs/remotes/origin/main || echo "no main to compare with"
          bash tests/setup_migrations.sh
  # a feature changed without its docs, or without a CHANGELOG.md entry, in this push: a
  # warning, unless a commit says "Docs: none (<reason>)", "Changelog: none (<reason>)"
  # (docs/development/testing.md#docs-with-the-features)
  changed:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the commit before the push and main, for a new branch
          fetch-depth: 0
      - name: Docs and changelog with the features
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 -I tests/check_docs_changed.py --base "$BEFORE"
  site:
    runs-on: ubuntu-latest
    env:
      # the Material team's notice about MkDocs 2.0, printed on every build
      NO_MKDOCS_2_WARNING: "1"
      # the site and repository of mkdocs.yml: those of the repository this runs in (a fork, the
      # development repository), not the defaults of mkdocs.yml (the public one)
      FFS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      FFS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      FFS_REPO_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build
        run: mkdocs build --strict
      - name: The anchors of GitHub are ids of the site
        run: python3 -I tests/check_site_anchors.py
      - name: Upload
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [links, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
