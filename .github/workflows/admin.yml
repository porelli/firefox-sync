name: admin

# The admin UI and sign-up policy image (admin/, see docs/admin/README.md), amd64 and arm64.
# Go cross-compiles in the Dockerfile: one runner builds both without emulation.
# The candidate admin-<sha12> is tested as published (ADMIN_IMAGE) against the
# published syncstorage and accounts images, then tagged admin-latest, from main only.
#
# Triggers: only what goes into the image. The rest of the tree the admin UI works
# with (compose files, quadlets, prepare_environment.sh, tests) changes on pushes that
# the syncstorage-rs workflow already tests, with the admin UI built from source.

on:
  workflow_dispatch:
  push:
    paths:
      - admin/**
      - .github/workflows/admin.yml

# a newer push supersedes a run in progress: an older candidate never overwrites admin-latest
concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

env:
  REPOSITORY_REGISTRY: ghcr.io
  REPOSITORY_FULL_NAME: ${{ github.repository }}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # the newest Go, as admin/Dockerfile's golang:1 (go.mod's go line is the minimum)
          go-version: stable
          cache-dependency-path: admin/go.sum

      - name: Unit tests
        working-directory: admin
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  build:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Candidate tag
        id: tags
        run: echo "image=${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME}:admin-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: admin
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.image }}
          # shown on the admin UI's health table
          build-args: |
            VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=firefox-sync admin UI and sign-up policy

  ## Sync only (no accounts): admin UI next to syncstorage, both backends ##
  e2e:
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database_backend: [mysql, postgres]
        # 1: on a database server outside the stack, with only the grants of docs/reference/database-users.md
        external_db: ["", "1"]
        # the database containers: mariadb, or mysql (mysql:lts, SYNC_DB=mysql) for the mysql backend
        sync_db: [mariadb]
        include:
          - database_backend: mysql
            external_db: ""
            sync_db: mysql
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Init images from this commit
        # the init scripts change with the admin UI (e.g. MAX_USERS): the published ones may
        # be older than this commit (the syncstorage-rs workflow rebuilds them in parallel)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: End-to-end tests
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          ADMIN_IMAGE: ${{ needs.build.outputs.image }}
          BACKEND: ${{ matrix.database_backend }}
          EXTERNAL_DB: ${{ matrix.external_db }}
          # your own PostgreSQL server: the stack applies its SQL itself (MySQL: checked only,
          # syncstorage-rs.yml has the other way round), docs/databases.md#let-the-stack-apply-them
          DB_BOOTSTRAP: ${{ matrix.external_db == '1' && matrix.database_backend == 'postgres' && '1' || '' }}
          SYNC_DB: ${{ matrix.sync_db }}
          SKIP_PULL: 1
        run: ./tests/e2e.sh "${BACKEND}"

  ## With the self-hosted accounts: sign-up policy, accounts, browser, on both architectures ##
  # and on MariaDB (FXA_DB=mariadb): the sign-up policy's SQL is ours, it must work on both
  e2e-fxa:
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            fxa_db: mysql
          - arch: arm64
            # GitHub has no -latest label for arm (actions/runner-images): the newest Ubuntu
            runner: ubuntu-26.04-arm
            fxa_db: mysql
          - arch: amd64
            runner: ubuntu-latest
            fxa_db: mariadb
          # Sync and the accounts on a server outside the stack (docs/databases.md#your-own-server)
          - arch: amd64
            runner: ubuntu-latest
            fxa_db: mysql
            external_db: "1"
          # the same on MySQL 8 with mysql_native_password, the servers of the installs from before
          - arch: amd64
            runner: ubuntu-latest
            fxa_db: mysql
            external_db: "1"
            fxa_mysql_image: mysql:8
          # the same on MariaDB (lts, or 11 for an accounts image without mozilla/fxa#21494)
          - arch: amd64
            runner: ubuntu-latest
            fxa_db: mariadb
            external_db: "1"
          # client certificates, then Authelia, in front of the accounts pages and the admin UI
          # (docs/access-control.md), without the prepare_environment.sh checks of the others
          - arch: amd64
            runner: ubuntu-latest
            fxa_db: mysql
            client_cert: "1"
          - arch: amd64
            runner: ubuntu-latest
            fxa_db: mysql
            sso: authelia
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Init images from this commit
        # the init scripts change with the admin UI (e.g. MAX_USERS): the published ones may
        # be older than this commit (the syncstorage-rs workflow rebuilds them in parallel)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: End-to-end tests with self-hosted Mozilla accounts (${{ matrix.fxa_db }}${{ matrix.external_db && ', your own database server' || '' }}${{ matrix.fxa_mysql_image && format(', {0}', matrix.fxa_mysql_image) || '' }}${{ matrix.client_cert && ', client certificates' || '' }}${{ matrix.sso && format(', {0}', matrix.sso) || '' }})
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          FXA_DB: ${{ matrix.fxa_db }}
          EXTERNAL_DB: ${{ matrix.external_db || '' }}
          # your own server on lts: the stack applies the SQL itself (MySQL 8: checked only)
          DB_BOOTSTRAP: ${{ matrix.external_db == '1' && !matrix.fxa_mysql_image && '1' || '' }}
          # (empty: the default, mysql:lts for an accounts image with mozilla/fxa#21554)
          FXA_MYSQL_IMAGE: ${{ matrix.fxa_mysql_image || '' }}
          ADMIN_IMAGE: ${{ needs.build.outputs.image }}
          FXA_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          FXA_VERSION: fxa-mono-latest
          FXA_ARCH: ${{ matrix.arch }}
          FXA_PAIRING_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver-latest
          SKIP_PULL: 1
          CLIENT_CERT: ${{ matrix.client_cert || '' }}
          SSO: ${{ matrix.sso || '' }}
          SKIP_SETUP: ${{ (matrix.client_cert || matrix.sso) && '1' || '' }}
        run: ./tests/e2e-fxa.sh

      # the page source and a screenshot of each Firefox window of a failed test_fxa_browser.py
      # (the directory tests/e2e-fxa.sh prints, kept only then; the job log has their text and form fields)
      - name: Upload the pages of the failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-pages-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ffs-browser-artifacts.*
          if-no-files-found: ignore
          retention-days: 7

  ## Rootless podman: compose on the Podman socket, quadlets, quadlets with the accounts ##
  podman:
    needs: build
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    # the accounts phase pulls a 5 GB image and takes up to 20 minutes to start
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        # rootless podman keeps its images in the home directory, on the root disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /

      - name: Set up rootless podman and a systemd user session
        run: |
          # Ubuntu 26.04's AppArmor profile of pasta refuses podman's signal (the script says more)
          .github/scripts/pasta-apparmor.sh
          sudo loginctl enable-linger "${USER}"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "${GITHUB_ENV}"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        # docker compose sends the docker CLI credentials to the Podman socket when pulling
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${TOKEN}" | podman login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin
          echo "${TOKEN}" | docker login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin

      - name: Init images from this commit
        # see the e2e job; podman has its own image store
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          podman build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          podman build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: Podman tests
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          ADMIN_IMAGE: ${{ needs.build.outputs.image }}
        run: ./tests/podman.sh

  ## admin-latest: the tested candidate, unchanged ##
  publish:
    needs: [build, e2e, e2e-fxa, podman]
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag admin-latest
        env:
          CANDIDATE: ${{ needs.build.outputs.image }}
        run: |
          docker buildx imagetools create -t "${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME}:admin-latest" "${CANDIDATE}"
          docker buildx imagetools inspect "${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME}:admin-latest"
