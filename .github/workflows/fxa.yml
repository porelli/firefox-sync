name: fxa-mono

# amd64 and arm64 builds of Mozilla's accounts image (mozilla/fxa-mono, published for
# amd64 only) from the upstream release tags, tested with tests/e2e-fxa.sh and
# tests/podman.sh on both architectures, and an upgrade from the published release
# with tests/fxa-upgrade.sh, before the multi-arch tags are published (and on
# MariaDB, without holding back the publishing, see test-mariadb).
# The pull requests of upstream-patches.yml are applied to the sources first (the label
# org.firefox-sync.upstream-patches lists them); a change of what is applied rebuilds the
# release under the same tags (a new digest). Upstream's code runs in jobs without write
# access; the images are pushed under tags of their run (<tag>-run<id>), tested by digest, and
# the multi-arch tags published from those digests on the default branch only (other branches
# build and test). One run at a time per branch.
# See docs/accounts.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FxA release tag to build (vX.Y.Z), default: newest release"
        type: string
        default: ""
      rebuild:
        description: Build even if an image for this release exists
        type: boolean
        default: false
  schedule:
    - cron: '45 6 * * 1' # every Monday, after the syncstorage-rs build
  push:
    paths:
      - .github/workflows/fxa.yml
      - upstream-patches.yml
      - upstream-patches/**
      - .github/scripts/upstream-patches.py

concurrency:
  # per branch: a branch run never cancels or waits for main's. A newer push to a branch cancels
  # its older run; main's runs (and tags') always finish
  group: fxa-mono-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}

env:
  REPOSITORY_REGISTRY: ghcr.io
  REPOSITORY_FULL_NAME: ${{ github.repository }}
  FXA_REPOSITORY: mozilla/fxa
  PAIRING_REPOSITORY: mozilla-services/channelserver

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.existing.outputs.build }}
      patches: ${{ steps.patches.outputs.label }}
      patches_obsolete: ${{ steps.patches.outputs.obsolete_json }}
      patches_present: ${{ steps.existing.outputs.present }}
      pairing_version: ${{ steps.pairing.outputs.version }}
      build_pairing: ${{ steps.pairing.outputs.build }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the release
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED}"
          if [ -z "${version}" ]; then
            version=$(git ls-remote --tags "https://github.com/${FXA_REPOSITORY}" 'refs/tags/v*' | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          # used in a checkout ref and in image tags: only accept a release tag
          if ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: '${version}'"
            exit 1
          fi
          echo "FxA release: ${version}"
          echo "version=${version}" >> ${GITHUB_OUTPUT}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Unit tests of the upstream patches script
        run: python3 tests/test_upstream_patches.py

      - name: Upstream patches for the release
        id: patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upstream-patches.py plan fxa-mono "${{ steps.version.outputs.version }}"

      - name: Look for an existing image
        id: existing
        env:
          REBUILD: ${{ inputs.rebuild }}
          PATCHES: ${{ steps.patches.outputs.label }}
        run: |
          image="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-mono-${{ steps.version.outputs.version }}"
          if [ "${REBUILD}" != true ] && config=$(docker buildx imagetools inspect "${image}" --format '{{json .Image}}' 2> /dev/null); then
            # the image of an index is per platform; built before upstream-patches.yml: unlabelled.
            # The plan of its build (-plan) against this one: what the build applied can be less
            # (a patch already in the sources), which a rebuild would not change
            labels=$(jq -c 'if has("config") then . else .["linux/amd64"] end | .config.Labels // {}' <<< "${config}")
            planned=$(jq -r '.["org.firefox-sync.upstream-patches-plan"] // "unlabelled"' <<< "${labels}")
            applied=$(jq -r '.["org.firefox-sync.upstream-patches"] // "unlabelled"' <<< "${labels}")
            if [ "${planned}" = "${PATCHES}" ]; then
              echo "${image} exists (upstream patches: ${applied}, planned: ${planned}), nothing to build"
              echo "build=false" >> "${GITHUB_OUTPUT}"
              # planned but not applied: already in the sources, for the job upstream-patches.
              # By pull request (<repo>#<pr>@): applied as the port of an older release it is
              # ${p}+<that release>, as the release pin of an older release another base..sha
              present=""
              for p in ${planned}; do
                [ "${p}" = none ] || [[ " ${applied}" == *" ${p%%@*}@"* ]] || present="${present:+${present} }${p}"
              done
              echo "present=${present}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "${image} was built for the upstream patches '${planned}', upstream-patches.yml '${PATCHES}': rebuilding it"
          fi
          echo "build=true" >> "${GITHUB_OUTPUT}"

      - name: Pairing server release
        id: pairing
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          # the QR code pairing server (channelserver), also amd64 only upstream
          version=$(git ls-remote --tags "https://github.com/${PAIRING_REPOSITORY}" | awk -F/ '{print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Pairing server release: ${version}"
          echo "version=${version}" >> ${GITHUB_OUTPUT}
          image="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver-${version}"
          if [ "${REBUILD}" != true ] && docker buildx imagetools inspect "${image}" > /dev/null 2>&1; then
            echo "${image} exists, nothing to build"
            echo "build=false" >> ${GITHUB_OUTPUT}
          else
            echo "build=true" >> ${GITHUB_OUTPUT}
          fi

  # The builds run upstream's code (its scripts, its Dockerfile) with a read-only token and
  # write an OCI archive; the push jobs, which can write packages, only copy that archive to
  # the registry under a tag of this run (<tag>-run<id>) and run nothing of upstream's. The
  # tests and publish use the digests the push jobs record (artifacts fxa-<name>-digest-<arch>,
  # one file of that name holding the digest; downloaded with merge-multiple, which puts every
  # file directly in the path whether one artifact matches or several).
  build-pairing:
    needs: prepare
    if: needs.prepare.outputs.build_pairing == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub has no -latest label for arm (actions/runner-images): the newest Ubuntu
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout the pairing server ${{ needs.prepare.outputs.pairing_version }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PAIRING_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.pairing_version }}
          persist-credentials: false

      - name: Version of the pairing server
        env:
          PAIRING_VERSION: ${{ needs.prepare.outputs.pairing_version }}
        run: |
          # upstream's CI fills version.json (served at /__version__), it says TBD otherwise
          printf '{"version":"%s","commit":"%s","source":"https://github.com/%s","build":"%s/%s/actions/runs/%s"}\n' \
            "${PAIRING_VERSION}" "$(git rev-parse HEAD)" "${{ env.PAIRING_REPOSITORY }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" | tee version.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.PAIRING_REPOSITORY }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.pairing_version }}
            org.opencontainers.image.licenses=MPL-2.0

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: fxa-channelserver-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  push-pairing:
    needs: [prepare, build-pairing]
    permissions:
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: The image built
        uses: actions/download-artifact@v8
        with:
          name: fxa-channelserver-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image

      - name: Push it under a tag of this run, record its digest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver-${{ needs.prepare.outputs.pairing_version }}-linux-${{ matrix.arch }}-run${{ github.run_id }}
        run: |
          echo "${TOKEN}" | skopeo login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin
          mkdir -p "${RUNNER_TEMP}/digest"
          skopeo copy --digestfile "${RUNNER_TEMP}/digestfile" "oci-archive:${RUNNER_TEMP}/image/image.tar" "docker://${TARGET}"
          digest=$(cat "${RUNNER_TEMP}/digestfile")
          echo "${TARGET} is ${digest}"
          echo "${digest}" > "${RUNNER_TEMP}/digest/fxa-channelserver-digest-${{ matrix.arch }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: fxa-channelserver-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
    outputs:
      # the same on both architectures; with the sources at hand: also a patch already in them
      patches_obsolete: ${{ steps.patches.outputs.obsolete_json }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub has no -latest label for arm (actions/runner-images): the newest Ubuntu
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout Mozilla accounts ${{ needs.prepare.outputs.version }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FXA_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.version }}
          # no credentials on the disk: the steps below run upstream's scripts (l10n)
          persist-credentials: false

      - name: Checkout upstream-patches.yml
        uses: actions/checkout@v7
        with:
          path: ffs
          persist-credentials: false
          sparse-checkout: |
            upstream-patches.yml
            upstream-patches/
            .github/scripts/upstream-patches.py
          sparse-checkout-cone-mode: false

      - name: Apply the upstream patches
        id: patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ffs/.github/scripts/upstream-patches.py apply fxa-mono "${{ needs.prepare.outputs.version }}" .
          # not in the image
          rm -rf ffs
          git status --short

      - name: Prepare the sources like upstream's docker workflow
        run: |
          ./_scripts/l10n/clone.sh
          # version.json as upstream writes it, pointing to the upstream release
          printf '{"version":{"hash":"%s","version":"%s","source":"https://github.com/%s","build":"%s/%s/actions/runs/%s"}}\n' \
            "$(git rev-parse HEAD)" "${{ needs.prepare.outputs.version }}" "${{ env.FXA_REPOSITORY }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            | tee packages/version.json apps/version.json

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: _dev/docker/mono/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.FXA_REPOSITORY }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MPL-2.0
            org.firefox-sync.upstream-patches=${{ steps.patches.outputs.label }}
            org.firefox-sync.upstream-patches-plan=${{ needs.prepare.outputs.patches }}

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: fxa-mono-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          # its layers are compressed already
          compression-level: 0
          retention-days: 1

  push:
    needs: [prepare, build]
    permissions:
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The image built
        uses: actions/download-artifact@v8
        with:
          name: fxa-mono-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image

      - name: Push it under a tag of this run, record its digest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-mono-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}-run${{ github.run_id }}
        run: |
          echo "${TOKEN}" | skopeo login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin
          mkdir -p "${RUNNER_TEMP}/digest"
          skopeo copy --digestfile "${RUNNER_TEMP}/digestfile" "oci-archive:${RUNNER_TEMP}/image/image.tar" "docker://${TARGET}"
          digest=$(cat "${RUNNER_TEMP}/digestfile")
          echo "${TARGET} is ${digest}"
          echo "${digest}" > "${RUNNER_TEMP}/digest/fxa-mono-digest-${{ matrix.arch }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: fxa-mono-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/*
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [prepare, build, push, build-pairing, push-pairing]
    # runs when anything was built (a skipped build means the image already exists)
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    # the accounts on MySQL: mysql_image empty is what tests/e2e-fxa.sh picks from the image's
    # label, mysql:lts with mozilla/fxa#21554 (upstream-patches.yml); mysql:8 with
    # mysql_native_password is what the installs from before run (pinned by --upgrade), with
    # the candidate's mysql2 driver
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub has no -latest label for arm (actions/runner-images): the newest Ubuntu
            runner: ubuntu-26.04-arm
          - arch: amd64
            runner: ubuntu-latest
            mysql_image: mysql:8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The digests of this run's images
        if: needs.push.result == 'success' || needs.push-pairing.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: fxa-*-digest-${{ matrix.arch }}
          merge-multiple: true

      # this run's: by digest (also under its tag of this run, which the upgrade's docker compose
      # pull reads), else the published release (the run built only the other image)
      - name: The images under test
        env:
          IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PAIRING_VERSION: ${{ needs.prepare.outputs.pairing_version }}
          BUILT: ${{ needs.push.result == 'success' }}
          PAIRING_BUILT: ${{ needs.push-pairing.result == 'success' }}
          PULL: docker
        run: |
          d="${RUNNER_TEMP}/digests"
          if [ "${BUILT}" = true ]; then
            digest="$(cat "${d}/fxa-mono-digest-${ARCH}")"
            tag="fxa-mono-${VERSION}-linux-${ARCH}-run${GITHUB_RUN_ID}"
            if [ -n "${PULL}" ]; then
              docker pull -q --platform "linux/${ARCH}" "${IMAGE}@${digest}" > /dev/null
              docker tag "${IMAGE}@${digest}" "${IMAGE}:${tag}"
            fi
            echo "FXA_TEST_IMAGE=${IMAGE}@${digest}" >> "${GITHUB_ENV}"
          else
            tag="fxa-mono-${VERSION}"
            echo "FXA_TEST_IMAGE=${IMAGE}:${tag}" >> "${GITHUB_ENV}"
          fi
          echo "FXA_VERSION=${tag}" >> "${GITHUB_ENV}"
          if [ "${PAIRING_BUILT}" = true ]; then
            echo "FXA_PAIRING_IMAGE=${IMAGE}@$(cat "${d}/fxa-channelserver-digest-${ARCH}")" >> "${GITHUB_ENV}"
          else
            echo "FXA_PAIRING_IMAGE=${IMAGE}:fxa-channelserver-${PAIRING_VERSION}" >> "${GITHUB_ENV}"
          fi
          grep '^FXA_' "${GITHUB_ENV}"

      - name: Init images from this commit
        # the admin UI of this commit needs the procedures and grants of its init scripts: the
        # published init images may be older (the syncstorage-rs workflow rebuilds them)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: End-to-end tests with our ${{ matrix.arch }} image${{ matrix.mysql_image && format(', the accounts on {0}', matrix.mysql_image) || '' }}
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          FXA_MYSQL_IMAGE: ${{ matrix.mysql_image }}
          # the init images above (the others are pulled when missing)
          SKIP_PULL: 1
          # FXA_VERSION, FXA_PAIRING_IMAGE: the images under test, above
          FXA_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          FXA_ARCH: ${{ matrix.arch }}
        run: ./tests/e2e-fxa.sh

      # the page source and a screenshot of each Firefox window of a failed test_fxa_browser.py
      # (the directory tests/e2e-fxa.sh prints, kept only then; the job log has their text and form fields)
      - name: Upload the pages of the failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-pages-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ffs-browser-artifacts.*
          if-no-files-found: ignore
          retention-days: 7

  # the candidate with the accounts database on MariaDB (FXA_DB=mariadb, docs/accounts.md#mysql-or-mariadb). Not needed
  # by publish: Mozilla supports MySQL only, a release that breaks MariaDB must not hold back
  # MySQL installs. The failed run is the warning for MariaDB installs (docs/accounts.md#mysql-or-mariadb: pin FXA_VERSION).
  # mariadb:lts, the default (12 today: needs mozilla/fxa#21494, upstream-patches.yml), and
  # mariadb:11, the installs from before it (pinned by prepare_environment.sh --upgrade). The
  # lts job, once the canary of the next major, is now the main one: it moves with the installs
  # that follow lts. No early warning before a major becomes lts: Docker Hub has no "next" tag
  test-mariadb:
    needs: [prepare, build, push, build-pairing, push-pairing]
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        mariadb_image: ["mariadb:lts", "mariadb:11"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The digests of this run's images
        if: needs.push.result == 'success' || needs.push-pairing.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: fxa-*-digest-amd64
          merge-multiple: true

      # this run's: by digest (also under its tag of this run, which the upgrade's docker compose
      # pull reads), else the published release (the run built only the other image)
      - name: The images under test
        env:
          IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          ARCH: amd64
          VERSION: ${{ needs.prepare.outputs.version }}
          PAIRING_VERSION: ${{ needs.prepare.outputs.pairing_version }}
          BUILT: ${{ needs.push.result == 'success' }}
          PAIRING_BUILT: ${{ needs.push-pairing.result == 'success' }}
          PULL: docker
        run: |
          d="${RUNNER_TEMP}/digests"
          if [ "${BUILT}" = true ]; then
            digest="$(cat "${d}/fxa-mono-digest-${ARCH}")"
            tag="fxa-mono-${VERSION}-linux-${ARCH}-run${GITHUB_RUN_ID}"
            if [ -n "${PULL}" ]; then
              docker pull -q --platform "linux/${ARCH}" "${IMAGE}@${digest}" > /dev/null
              docker tag "${IMAGE}@${digest}" "${IMAGE}:${tag}"
            fi
            echo "FXA_TEST_IMAGE=${IMAGE}@${digest}" >> "${GITHUB_ENV}"
          else
            tag="fxa-mono-${VERSION}"
            echo "FXA_TEST_IMAGE=${IMAGE}:${tag}" >> "${GITHUB_ENV}"
          fi
          echo "FXA_VERSION=${tag}" >> "${GITHUB_ENV}"
          if [ "${PAIRING_BUILT}" = true ]; then
            echo "FXA_PAIRING_IMAGE=${IMAGE}@$(cat "${d}/fxa-channelserver-digest-${ARCH}")" >> "${GITHUB_ENV}"
          else
            echo "FXA_PAIRING_IMAGE=${IMAGE}:fxa-channelserver-${PAIRING_VERSION}" >> "${GITHUB_ENV}"
          fi
          grep '^FXA_' "${GITHUB_ENV}"

      - name: Init images from this commit
        # the admin UI of this commit needs the procedures and grants of its init scripts: the
        # published init images may be older (the syncstorage-rs workflow rebuilds them)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: End-to-end tests with our amd64 image, the accounts on ${{ matrix.mariadb_image }}
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          SKIP_PULL: 1
          FXA_DB: mariadb
          FXA_MARIADB_IMAGE: ${{ matrix.mariadb_image }}
          # FXA_VERSION, FXA_PAIRING_IMAGE: the images under test, above
          FXA_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          FXA_ARCH: amd64
        run: ./tests/e2e-fxa.sh

      # the page source and a screenshot of each Firefox window of a failed test_fxa_browser.py
      # (the directory tests/e2e-fxa.sh prints, kept only then; the job log has their text and form fields)
      - name: Upload the pages of the failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-pages-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ffs-browser-artifacts.*
          if-no-files-found: ignore
          retention-days: 7

  # an install of the published release (fxa-mono-latest, not moved yet) with an account,
  # a device and Sync data, upgraded in place to the candidate as docs/upgrading.md#self-hosted-accounts says; on MySQL 8 with
  # mysql_native_password as the installs from before, through --upgrade, then with a
  # candidate that has mozilla/fxa#21554 moved to mysql:lts as docs/upgrading.md#mysql-8-to-9 says
  test-upgrade:
    needs: [prepare, build, push, build-pairing, push-pairing]
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        # two accounts images of 5 GB
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The digests of this run's images
        if: needs.push.result == 'success' || needs.push-pairing.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: fxa-*-digest-amd64
          merge-multiple: true

      # this run's: by digest (also under its tag of this run, which the upgrade's docker compose
      # pull reads), else the published release (the run built only the other image)
      - name: The images under test
        env:
          IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          ARCH: amd64
          VERSION: ${{ needs.prepare.outputs.version }}
          PAIRING_VERSION: ${{ needs.prepare.outputs.pairing_version }}
          BUILT: ${{ needs.push.result == 'success' }}
          PAIRING_BUILT: ${{ needs.push-pairing.result == 'success' }}
          PULL: docker
        run: |
          d="${RUNNER_TEMP}/digests"
          if [ "${BUILT}" = true ]; then
            digest="$(cat "${d}/fxa-mono-digest-${ARCH}")"
            tag="fxa-mono-${VERSION}-linux-${ARCH}-run${GITHUB_RUN_ID}"
            if [ -n "${PULL}" ]; then
              docker pull -q --platform "linux/${ARCH}" "${IMAGE}@${digest}" > /dev/null
              docker tag "${IMAGE}@${digest}" "${IMAGE}:${tag}"
            fi
            echo "FXA_TEST_IMAGE=${IMAGE}@${digest}" >> "${GITHUB_ENV}"
          else
            tag="fxa-mono-${VERSION}"
            echo "FXA_TEST_IMAGE=${IMAGE}:${tag}" >> "${GITHUB_ENV}"
          fi
          echo "FXA_VERSION=${tag}" >> "${GITHUB_ENV}"
          if [ "${PAIRING_BUILT}" = true ]; then
            echo "FXA_PAIRING_IMAGE=${IMAGE}@$(cat "${d}/fxa-channelserver-digest-${ARCH}")" >> "${GITHUB_ENV}"
          else
            echo "FXA_PAIRING_IMAGE=${IMAGE}:fxa-channelserver-${PAIRING_VERSION}" >> "${GITHUB_ENV}"
          fi
          grep '^FXA_' "${GITHUB_ENV}"

      - name: Init images from this commit
        # the admin UI of this commit needs the procedures and grants of its init scripts: the
        # published init images may be older (the syncstorage-rs workflow rebuilds them)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: Upgrade from the published release to our amd64 image
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          # the init images above and the candidate by its digest; the older release is pulled,
          # and the upgrade's own docker compose pull runs anyway, as docs/upgrading.md#self-hosted-accounts says: FXA_VERSION
          # (the images under test, above) is the candidate's tag of this run, that digest
          SKIP_PULL: 1
          FXA_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          FXA_ARCH: amd64
        run: |
          from="${REPOSITORY}:fxa-mono-latest"
          # the first release published here has nothing to upgrade from
          if ! docker buildx imagetools inspect "${from}" > /dev/null 2>&1; then
            echo "no ${from} yet, nothing to upgrade"
            exit 0
          fi
          # a rebuild of an older release (workflow_dispatch) would be a downgrade
          docker pull -q --platform linux/amd64 "${from}" > /dev/null
          published=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "${from}")
          candidate="${{ needs.prepare.outputs.version }}"
          if [ "${published}" != "${candidate}" ] && [ "$(printf '%s\n' "${published}" "${candidate}" | sort -V | tail -n 1)" = "${published}" ]; then
            echo "${from} is ${published}, newer than ${candidate}: nothing to upgrade"
            exit 0
          fi
          FXA_FROM="${from}" ./tests/fxa-upgrade.sh

  # the candidate under rootless podman too: quadlets with the accounts, set up by
  # prepare_environment.sh like a user would (and compose on the Podman socket)
  test-podman:
    needs: [prepare, build, push, build-pairing, push-pairing]
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub has no -latest label for arm (actions/runner-images): the newest Ubuntu
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    # compose (MariaDB, PostgreSQL), quadlets, then the 5 GB accounts image and its
    # quadlets (up to 20 minutes to start)
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        # rootless podman keeps its images in the home directory, on the root disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /

      - name: Set up rootless podman and a systemd user session
        run: |
          # not on every runner image
          command -v podman > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
          # Ubuntu 26.04's AppArmor profile of pasta refuses podman's signal (the script says more)
          .github/scripts/pasta-apparmor.sh
          sudo loginctl enable-linger "${USER}"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "${GITHUB_ENV}"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        # docker compose sends the docker CLI credentials to the Podman socket when pulling
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${TOKEN}" | podman login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin
          echo "${TOKEN}" | docker login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin

      - name: The digests of this run's images
        if: needs.push.result == 'success' || needs.push-pairing.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: fxa-*-digest-${{ matrix.arch }}
          merge-multiple: true

      # this run's: by digest (also under its tag of this run, which the upgrade's docker compose
      # pull reads), else the published release (the run built only the other image)
      - name: The images under test
        env:
          IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PAIRING_VERSION: ${{ needs.prepare.outputs.pairing_version }}
          BUILT: ${{ needs.push.result == 'success' }}
          PAIRING_BUILT: ${{ needs.push-pairing.result == 'success' }}
          PULL: ""
        run: |
          d="${RUNNER_TEMP}/digests"
          if [ "${BUILT}" = true ]; then
            digest="$(cat "${d}/fxa-mono-digest-${ARCH}")"
            tag="fxa-mono-${VERSION}-linux-${ARCH}-run${GITHUB_RUN_ID}"
            if [ -n "${PULL}" ]; then
              docker pull -q --platform "linux/${ARCH}" "${IMAGE}@${digest}" > /dev/null
              docker tag "${IMAGE}@${digest}" "${IMAGE}:${tag}"
            fi
            echo "FXA_TEST_IMAGE=${IMAGE}@${digest}" >> "${GITHUB_ENV}"
          else
            tag="fxa-mono-${VERSION}"
            echo "FXA_TEST_IMAGE=${IMAGE}:${tag}" >> "${GITHUB_ENV}"
          fi
          echo "FXA_VERSION=${tag}" >> "${GITHUB_ENV}"
          if [ "${PAIRING_BUILT}" = true ]; then
            echo "FXA_PAIRING_IMAGE=${IMAGE}@$(cat "${d}/fxa-channelserver-digest-${ARCH}")" >> "${GITHUB_ENV}"
          else
            echo "FXA_PAIRING_IMAGE=${IMAGE}:fxa-channelserver-${PAIRING_VERSION}" >> "${GITHUB_ENV}"
          fi
          grep '^FXA_' "${GITHUB_ENV}"

      - name: Init images from this commit
        # see the test job; podman has its own image store
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          podman build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          podman build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: Podman tests with our ${{ matrix.arch }} image
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
        run: ./tests/podman.sh

  # from the default branch only: a branch (an unmerged pin in upstream-patches.yml) builds and
  # tests under its own tags. The multi-arch tags from the digests this run built and tested:
  # each image only when this run built it
  publish:
    needs: [prepare, push, push-pairing, test, test-podman, test-upgrade]
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.test-podman.result == 'success' && needs.test-upgrade.result == 'success' }}
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: The digests of this run's images, tested
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: fxa-*-digest-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Multi-arch tags
        env:
          BUILT: ${{ needs.push.result == 'success' }}
          PAIRING_BUILT: ${{ needs.push-pairing.result == 'success' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PAIRING_VERSION: ${{ needs.prepare.outputs.pairing_version }}
        run: |
          image="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}"
          # <name>:<tag 1> <tag 2>, from the digests of fxa-<name>-digest-amd64 and -arm64
          publish() {
            local digests=() arch
            for arch in amd64 arm64; do
              digests+=("${image}@$(cat "${RUNNER_TEMP}/digests/fxa-$1-digest-${arch}")")
            done
            docker buildx imagetools create -t "${image}:fxa-$1-$2" -t "${image}:fxa-$1-latest" "${digests[@]}"
            docker buildx imagetools inspect "${image}:fxa-$1-$2"
          }
          [ "${BUILT}" = true ] && publish mono "${VERSION}"
          [ "${PAIRING_BUILT}" = true ] && publish channelserver "${PAIRING_VERSION}"
          exit 0

  # an entry of upstream-patches.yml that is in the release now (not applied any more): red
  # until it is removed and its when_released done. After publish, which it does not hold back
  upstream-patches:
    needs: [prepare, build, publish]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Upstream patches in the release now
        env:
          OBSOLETE: ${{ needs.build.outputs.patches_obsolete || needs.prepare.outputs.patches_obsolete }}
          # not built now: the published image was planned with them, but they were in the sources
          PRESENT: ${{ needs.prepare.outputs.patches_present }}
        run: |
          if [ -n "${PRESENT}" ]; then
            for p in ${PRESENT}; do
              echo "::error title=Upstream patch released::${p} is already in the sources of the release, not applied: remove its entry from upstream-patches.yml and do what its when_released says"
            done
            exit 1
          fi
          if [ "$(jq length <<< "${OBSOLETE:-[]}")" = 0 ]; then
            echo "No entry of upstream-patches.yml for fxa-mono is in the release yet"
            exit 0
          fi
          jq -r '.[] | "::error title=Upstream patch released::\(.id), \(.pr) is in the release, no longer applied. Remove the entry from upstream-patches.yml and: \(.when_released)"' <<< "${OBSOLETE}"
          exit 1
