name: Find head
# The commit of this repository the run builds (the init images): the checked out one, the
# head of the branch pushed, or of the default branch for scheduled and manual runs. The
# releases are .github/workflows/release.yml's.

inputs:
  event_name:
    required: true
    type: string
  repository_main_branch:
    required: true
    type: string

outputs:
  internal_commit_branch_name:
    value: ${{ steps.checkout.outputs.internal_commit_branch_name }}
  internal_commit_head:
    value: ${{ steps.checkout.outputs.internal_commit_head }}

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: The commit
      id: checkout
      shell: bash
      env:
        EVENT: ${{ inputs.event_name }}
        MAIN: ${{ inputs.repository_main_branch }}
      run: |
        if [ "${EVENT}" = push ]; then
          branch=$(git rev-parse --abbrev-ref HEAD)
        else
          branch=${MAIN}
        fi
        echo "internal_commit_branch_name=${branch}" >> "${GITHUB_OUTPUT}"
        echo "internal_commit_head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
