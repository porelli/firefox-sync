# Test-only additions, used together with docker-compose.yml or docker-compose.postgres.yml
# Adds upstream's mock FxA OAuth server, shipped in the syncstorage-rs image, so that the
# tokenserver login flow can be tested without a Mozilla account.
# Point FXA_OAUTH_SERVER_URL to http://mock_fxa:6000 in the env file.

services:
  mock_fxa:
    image: ${REPOSITORY}:${SYNCSTORAGE_IMAGE}-${SYNCSTORAGE_IMAGE_TAG}
    entrypoint: ["sh", "/app/scripts/start_mock_fxa_server.sh"]
    environment:
      MOCK_FXA_SERVER_HOST: 0.0.0.0
      MOCK_FXA_SERVER_PORT: 6000
    restart: "no"
