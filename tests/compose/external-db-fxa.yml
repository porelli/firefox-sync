# Test-only: the accounts on a MySQL server outside the stack (EXTERNAL_DB=1 or fxa in
# tests/e2e-fxa.sh), FXA_DB_CONTAINERS=0; with tests/compose/external-db.yml when Sync
# is there too.

services:
  fxa-db-bootstrap:
    networks: [default, extdb]
  fxa-migrations:
    networks: [default, extdb]
  fxa-policy:
    networks: [default, extdb]
  fxa-auth:
    networks: [default, extdb]
  fxa-profile:
    networks: [default, extdb]
  # (also in external-db.yml: with Sync on the server too)
  ffs-admin:
    networks: [default, extdb]
  # the Python tests run in its image, they look into the accounts database
  syncstorage:
    networks: [default, extdb]

networks:
  extdb:
    external: true
    name: ${EXTDB_NETWORK:?}
