# Test-only: the Sync server on a database server outside the stack (EXTERNAL_DB=1 in
# tests/e2e.sh and tests/e2e-fxa.sh), on its own network EXTDB_NETWORK like a server elsewhere.
# Used with SYNC_DB_CONTAINERS=0: the containers that connect to the database join that network.

services:
  db-bootstrap:
    networks: [default, extdb]
  syncstorage_migrate:
    networks: [default, extdb]
  syncstorage:
    networks: [default, extdb]
  tokenserver_db_init:
    networks: [default, extdb]
  ffs-admin:
    networks: [default, extdb]
  backup:
    networks: [default, extdb]

networks:
  extdb:
    external: true
    name: ${EXTDB_NETWORK:?}
