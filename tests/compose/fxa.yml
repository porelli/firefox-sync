# Test-only additions to compose/fxa.yml (paths relative to compose/): the CA of the reverse proxy
# serving the public URLs over HTTPS (tests/compose/proxy-<caddy|nginx|traefik>.yml, the
# configuration prepare_environment.sh writes), Mailpit catching the verification emails, the
# admin UI under test (ADMIN_IMAGE, built from admin/ by tests/e2e-fxa.sh unless given), which
# also signs in with these accounts (OpenID Connect).
# The containers resolve the public host names to the proxy through network aliases.

x-trust-caddy: &trust-caddy
  NODE_EXTRA_CA_CERTS: /caddy-ca/root.crt

# the healthchecks every second while the containers start (start_interval, within
# start_period), then as set: what waits for "healthy" (docker compose up for the
# dependencies, tests/e2e-fxa.sh) waits a second, not the first interval (10 to 60 s)
x-health-test: &health-test
  start_period: 5m
  start_interval: 1s

services:
  # SSO=authelia (COMPOSE_PROFILES): forward auth in front of the accounts pages and of the
  # admin UI's admin-sso.fxa.test, its login page at auth.fxa.test (tests/caddy/authelia)
  authelia:
    image: authelia/authelia:latest
    profiles: [authelia]
    volumes:
      - ../tests/caddy/authelia/configuration.yml:/config/configuration.yml:ro
      - ../tests/caddy/authelia/users.yml:/config/users.yml:ro

  # the CA of the reverse proxy under test (tests/compose/proxy-*.yml, TEST_PROXY of
  # tests/e2e-fxa.sh) for the FxA services and the tests: Caddy keeps its own private (the bundled
  # Caddy's, in its data volume), nginx and Traefik have a test CA (proxy-nginx.yml, proxy-traefik.yml)
  caddy-ca:
    image: caddy:alpine
    command: [sh, -c, "until [ -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done; cp /data/caddy/pki/authorities/local/root.crt /caddy-ca/root.crt && chmod 644 /caddy-ca/root.crt"]
    volumes:
      - caddy-data:/data:ro
      - caddy-ca:/caddy-ca
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    # the image's own check, explicit
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # the destinations of ADMIN_NOTIFY: records what it gets (tests/notify_sink.py), in the
  # Python of the Sync server's image
  notify-sink:
    image: ${IMAGE_REPOSITORY:-${REPOSITORY:-}}:${SYNC_IMAGE:-${SYNCSTORAGE_IMAGE:-}}-${SYNC_IMAGE_TAG:-${SYNCSTORAGE_IMAGE_TAG:-}}
    entrypoint: ["python3", "/notify_sink.py"]
    volumes:
      - ../tests/notify_sink.py:/notify_sink.py:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8000/_received"]
      start_period: 10s
      interval: 10s
      timeout: 5s
    restart: "no"

  # the admin UI and sign-up policy under test
  fxa-policy:
    pull_policy: missing

  ffs-admin:
    pull_policy: missing
    healthcheck: *health-test
    environment:
      # everything faster, alerts to the mail catcher
      METRICS_FLUSH_SECONDS: 5
      HEALTH_CHECK_SECONDS: 5
      ALERT_INTERVAL_SECONDS: 5
      ALERT_EMAIL: admin@fxa.test
      # and to a webhook, besides the email (tests/test_fxa_admin.py)
      ADMIN_NOTIFY: webhook+http://notify-sink:8000/fxa-hook/ffs-test-fxa-secret
      SMTP_INSECURE_AUTH: 1
      METRICS_TOKEN: ffs-test-metrics-token
      ADMIN_UPDATE_CHECK: "false"
      ADMIN_STALE_DAYS: 0
      ADMIN_UNCONFIRMED_HOURS: 0
      # signs in with the accounts (ADMIN_FXA_CLIENT_ID in tests/e2e-fxa.sh) through Caddy
      SSL_CERT_FILE: /caddy-ca/root.crt
    volumes:
      - caddy-ca:/caddy-ca:ro
    depends_on:
      caddy-ca:
        condition: service_completed_successfully

  # the data deletion endpoint (SYNC_DELETE_DATA): the tokenserver asks the node, its own public
  # URL (https://sync.fxa.test, through the proxy under test), to delete; its certificate is of
  # the test CA (not at /caddy-ca, where the tests' containers of this service mount it)
  syncstorage:
    healthcheck: *health-test
    environment:
      SSL_CERT_FILE: /ffs-test-ca/root.crt
    volumes:
      - caddy-ca:/ffs-test-ca:ro
    depends_on:
      caddy-ca:
        condition: service_completed_successfully

  fxa-auth:
    healthcheck: *health-test
    environment:
      <<: *trust-caddy
    volumes:
      - caddy-ca:/caddy-ca:ro
    depends_on:
      caddy-ca:
        condition: service_completed_successfully

  fxa-content:
    healthcheck: *health-test
    environment:
      <<: *trust-caddy
    volumes:
      - caddy-ca:/caddy-ca:ro
    depends_on:
      caddy-ca:
        condition: service_completed_successfully

  fxa-profile:
    healthcheck: *health-test
    environment:
      <<: *trust-caddy
    volumes:
      - caddy-ca:/caddy-ca:ro
    depends_on:
      caddy-ca:
        condition: service_completed_successfully

  tokenserver_db:
    healthcheck: *health-test
  syncstorage_db:
    healthcheck: *health-test
  backup:
    healthcheck: *health-test
  fxa-db:
    healthcheck: *health-test
  fxa-redis:
    healthcheck: *health-test
  fxa-profile-worker:
    healthcheck: *health-test
  fxa-profile-static:
    healthcheck: *health-test
  fxa-pairing:
    healthcheck: *health-test
  backup-fxa:
    healthcheck: *health-test

volumes:
  caddy-data:
  caddy-ca:
