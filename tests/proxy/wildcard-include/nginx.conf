# Firefox Sync behind nginx: put this file into nginx's configuration (/etc/nginx/conf.d/ or
# sites-enabled/), then: nginx -t && systemctl reload nginx. One certificate for every host below
# (PROXY_CERTS=one): /etc/nginx/snippets/ssl-example.com.conf, which must cover each of their names (docs/reverse-proxy.md#certificates)
# Written by prepare_environment.sh from @WORK@/wildcard-include.env (changed 2026-01-01 00:00:00 UTC).
# Again by --upgrade and --render-proxy: a change of yours is then kept aside, as
# <file>.before-<...>-<time>. See docs/reverse-proxy.md

# HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name sync.example.com;
  return 301 https://$host$request_uri;
}

# the Sync server (SYNC_PUBLIC_URL), to SYNC_EXPORT_PORT
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name sync.example.com;
  include /etc/nginx/snippets/ssl-example.com.conf;
  # a Sync request can be up to 2.5 MB, more than nginx's 1 MB default: without this,
  # large batches fail with 413 (docs/reverse-proxy.md#request-size)
  client_max_body_size 10m;
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 120;
    proxy_connect_timeout 10;
    gzip off;
  }
}
