# Firefox Sync behind Traefik: a dynamic configuration of its file provider (providers.file,
# filename or directory): put this file there, Traefik reads it again by itself. Traefik on this host
# (the stack's ports are on 127.0.0.1); in a container, see the labels (PROXY=traefik). Entry points:
# TRAEFIK_ENTRYPOINTS, TRAEFIK_HTTP_ENTRYPOINT; certificates: TRAEFIK_CERTRESOLVER (empty: the default)
# Written by prepare_environment.sh from .env (docs/reverse-proxy.md), again by --upgrade and
# --render-proxy: a change of yours is then kept aside, as <file>.before-<...>-<time>.
http:
  routers:
    # the Sync server (SYNC_PUBLIC_URL), to SYNC_EXPORT_PORT
    ffs-sync:
      rule: "Host(`sync.example.com`)"
      entryPoints: [https, https6]
      service: ffs-sync
      middlewares: [ffs-sync-body]
      tls:
        certResolver: le
    # the accounts pages (FXA_CONTENT_URL), to FXA_CONTENT_EXPORT_PORT
    ffs-content:
      rule: "Host(`accounts.example.com`)"
      entryPoints: [https, https6]
      service: ffs-content
      tls:
        certResolver: le
    # the sign-up gate of the admin UI: /v1/account/create to ADMIN_GATE_EXPORT_PORT (docs/reverse-proxy.md#sign-up-gate)
    ffs-gate:
      rule: "Host(`api.example.com`) && Path(`/v1/account/create`)"
      priority: 1000
      entryPoints: [https, https6]
      service: ffs-gate
      tls:
        certResolver: le
    # the accounts API (FXA_AUTH_URL), to FXA_AUTH_EXPORT_PORT
    ffs-api:
      rule: "Host(`api.example.com`)"
      entryPoints: [https, https6]
      service: ffs-api
      tls:
        certResolver: le
    # the avatars: /img/ to FXA_PROFILE_STATIC_EXPORT_PORT, without /img
    ffs-img:
      rule: "Host(`profile.example.com`) && PathPrefix(`/img/`)"
      priority: 1000
      entryPoints: [https, https6]
      service: ffs-img
      middlewares: [ffs-img-strip]
      tls:
        certResolver: le
    # the accounts profile server (FXA_PROFILE_URL), to FXA_PROFILE_EXPORT_PORT
    ffs-profile:
      rule: "Host(`profile.example.com`)"
      entryPoints: [https, https6]
      service: ffs-profile
      tls:
        certResolver: le
    # your own pairing server (FXA_PAIRING_URL), a websocket, to FXA_PAIRING_EXPORT_PORT (docs/reverse-proxy.md#pairing)
    ffs-pairing:
      rule: "Host(`pairing.example.com`)"
      entryPoints: [https, https6]
      service: ffs-pairing
      tls:
        certResolver: le
    # the admin UI (ADMIN_OIDC_REDIRECT_URL), to ADMIN_EXPORT_PORT, only from PROXY_ADMIN_ALLOW (docs/reverse-proxy.md#the-admin-ui)
    ffs-admin:
      rule: "Host(`admin.example.com`)"
      entryPoints: [https, https6]
      service: ffs-admin
      middlewares: [ffs-admin-headers]
      tls:
        certResolver: le
    # HTTP to HTTPS
    ffs-https:
      rule: "Host(`sync.example.com`) || Host(`accounts.example.com`) || Host(`api.example.com`) || Host(`profile.example.com`) || Host(`pairing.example.com`) || Host(`admin.example.com`)"
      entryPoints: [http]
      middlewares: [ffs-https]
      service: noop@internal
  middlewares:
    ffs-https:
      redirectScheme:
        scheme: https
        permanent: true
    # (docs/reverse-proxy.md#request-size)
    ffs-sync-body:
      buffering:
        maxRequestBodyBytes: 10485760
    ffs-img-strip:
      stripPrefix:
        prefixes: ["/img"]
    # the headers of the trusted-header sign-in: never the client's
    ffs-admin-headers:
      headers:
        customRequestHeaders:
          Remote-Email: ""
          Remote-Groups: ""
  services:
    ffs-sync:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:5000"
    ffs-content:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3030"
    ffs-gate:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8091"
    ffs-api:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9000"
    ffs-img:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1112"
    ffs-profile:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1111"
    ffs-pairing:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8058"
    ffs-admin:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8090"
