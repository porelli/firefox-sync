# Firefox Sync behind nginx: put this file into nginx's configuration (/etc/nginx/conf.d/ or
# sites-enabled/), with the certificates where ssl_certificate says first (nginx does not start
# without them: certbot certonly --standalone -d <host> for each host below, nginx stopped, or
# certbot --nginx on a server of its own), then: nginx -t && systemctl reload nginx
# Written by prepare_environment.sh from .env (docs/reverse-proxy.md), again by --upgrade and
# --render-proxy: a change of yours is then kept aside, as <file>.before-<...>-<time>.

# HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name sync.example.com accounts.example.com api.example.com profile.example.com pairing.example.com admin.example.com;
  return 301 https://$host$request_uri;
}

# the Sync server (SYNC_PUBLIC_URL), to SYNC_EXPORT_PORT
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name sync.example.com;
  ssl_certificate /etc/letsencrypt/live/sync.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
  # a Sync request can be up to 2.5 MB, more than nginx's 1 MB default: without this,
  # large batches fail with 413 (docs/reverse-proxy.md#request-size)
  client_max_body_size 10m;
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 120;
    proxy_connect_timeout 10;
    gzip off;
  }
}

# the accounts pages (FXA_CONTENT_URL), to FXA_CONTENT_EXPORT_PORT
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name accounts.example.com;
  ssl_certificate /etc/letsencrypt/live/accounts.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/accounts.example.com/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:3030;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

# the accounts API (FXA_AUTH_URL), to FXA_AUTH_EXPORT_PORT
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.example.com;
  ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  # the sign-up gate of the admin UI: /v1/account/create to ADMIN_GATE_EXPORT_PORT (docs/reverse-proxy.md#sign-up-gate)
  location = /v1/account/create {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

# the accounts profile server (FXA_PROFILE_URL), to FXA_PROFILE_EXPORT_PORT
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name profile.example.com;
  ssl_certificate /etc/letsencrypt/live/profile.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/profile.example.com/privkey.pem;
  # the avatars: /img/ to FXA_PROFILE_STATIC_EXPORT_PORT, without /img
  location /img/ {
    proxy_pass http://127.0.0.1:1112/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
  location / {
    proxy_pass http://127.0.0.1:1111;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

# your own pairing server (FXA_PAIRING_URL), a websocket, to FXA_PAIRING_EXPORT_PORT (docs/reverse-proxy.md#pairing)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name pairing.example.com;
  ssl_certificate /etc/letsencrypt/live/pairing.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pairing.example.com/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:8058;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # a pairing waits for the other device: not closed after 60 s
    proxy_read_timeout 600;
  }
}

# the admin UI (ADMIN_OIDC_REDIRECT_URL), to ADMIN_EXPORT_PORT, only from PROXY_ADMIN_ALLOW (docs/reverse-proxy.md#the-admin-ui)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name admin.example.com;
  ssl_certificate /etc/letsencrypt/live/admin.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}
