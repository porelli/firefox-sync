# Firefox Sync behind Traefik: a dynamic configuration of its file provider (providers.file,
# filename or directory): put this file there, Traefik reads it again by itself. Traefik on this host
# (the stack's ports are on 127.0.0.1); in a container, see the labels (PROXY=traefik). Entry points:
# TRAEFIK_ENTRYPOINTS, TRAEFIK_HTTP_ENTRYPOINT; certificates: TRAEFIK_CERTRESOLVER (empty: the default)
# Written by prepare_environment.sh from @WORK@/quadlets-caddy-internal.env (changed 2026-01-01 00:00:00 UTC).
# Again by --upgrade and --render-proxy: a change of yours is then kept aside, as
# <file>.before-<...>-<time>. See docs/reverse-proxy.md
http:
  routers:
    # the Sync server (SYNC_PUBLIC_URL), to SYNC_EXPORT_PORT
    firefox-sync-sync:
      rule: "Host(`sync.example.com`)"
      entryPoints: [websecure]
      service: firefox-sync-sync
      middlewares: [firefox-sync-sync-body]
      tls: {}
    # the accounts pages (FXA_CONTENT_URL), to FXA_CONTENT_EXPORT_PORT
    firefox-sync-content:
      rule: "Host(`accounts.example.com`)"
      entryPoints: [websecure]
      service: firefox-sync-content
      tls: {}
    # the sign-up gate of the admin UI: /v1/account/create to ADMIN_GATE_EXPORT_PORT (docs/reverse-proxy.md#sign-up-gate)
    firefox-sync-gate:
      rule: "Host(`api.example.com`) && Path(`/v1/account/create`)"
      priority: 1000
      entryPoints: [websecure]
      service: firefox-sync-gate
      tls: {}
    # the accounts API (FXA_AUTH_URL), to FXA_AUTH_EXPORT_PORT
    firefox-sync-api:
      rule: "Host(`api.example.com`)"
      entryPoints: [websecure]
      service: firefox-sync-api
      tls: {}
    # the avatars: /img/ to FXA_PROFILE_STATIC_EXPORT_PORT, without /img
    firefox-sync-img:
      rule: "Host(`profile.example.com`) && PathPrefix(`/img/`)"
      priority: 1000
      entryPoints: [websecure]
      service: firefox-sync-img
      middlewares: [firefox-sync-img-strip]
      tls: {}
    # the accounts profile server (FXA_PROFILE_URL), to FXA_PROFILE_EXPORT_PORT
    firefox-sync-profile:
      rule: "Host(`profile.example.com`)"
      entryPoints: [websecure]
      service: firefox-sync-profile
      tls: {}
    # the admin UI (ADMIN_OIDC_REDIRECT_URL), to ADMIN_EXPORT_PORT, only from PROXY_ADMIN_ALLOW (docs/reverse-proxy.md#the-admin-ui)
    firefox-sync-admin:
      rule: "Host(`admin.example.com`)"
      entryPoints: [websecure]
      service: firefox-sync-admin
      middlewares: [firefox-sync-admin-allow]
      tls: {}
    # HTTP to HTTPS
    firefox-sync-https:
      rule: "Host(`sync.example.com`) || Host(`accounts.example.com`) || Host(`api.example.com`) || Host(`profile.example.com`) || Host(`admin.example.com`)"
      entryPoints: [web]
      middlewares: [firefox-sync-https]
      service: noop@internal
  middlewares:
    firefox-sync-https:
      redirectScheme:
        scheme: https
        permanent: true
    # (docs/reverse-proxy.md#request-size)
    firefox-sync-sync-body:
      buffering:
        maxRequestBodyBytes: 10485760
    firefox-sync-img-strip:
      stripPrefix:
        prefixes: ["/img"]
    firefox-sync-admin-allow:
      ipAllowList:
        sourceRange: ["192.0.2.0/24", "2001:db8::/32"]
  services:
    firefox-sync-sync:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:5005"
    firefox-sync-content:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3030"
    firefox-sync-gate:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8091"
    firefox-sync-api:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9000"
    firefox-sync-img:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1112"
    firefox-sync-profile:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1111"
    firefox-sync-admin:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8090"
