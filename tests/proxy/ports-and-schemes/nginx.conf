# Firefox Sync behind nginx: put this file into nginx's configuration (/etc/nginx/conf.d/ or
# sites-enabled/), with the certificates where ssl_certificate says first: nginx does not start
# without them. nginx running: certbot certonly --nginx -d <host> (or --webroot) for each host below;
# --standalone only on a host with no web server (docs/reverse-proxy.md#certificates). Then:
# nginx -t && systemctl reload nginx
# Written by prepare_environment.sh from @WORK@/ports-and-schemes.env (changed 2026-01-01 00:00:00 UTC).
# Again by --upgrade and --render-proxy: a change of yours is then kept aside, as
# <file>.before-<...>-<time>. See docs/reverse-proxy.md

# HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name accounts.example.com;
  return 301 https://$host:8443$request_uri;
}

# HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name api.example.com;
  return 301 https://$host:4443$request_uri;
}

# HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name profile.example.com;
  return 301 https://$host$request_uri;
}

# the Sync server (SYNC_PUBLIC_URL), to SYNC_EXPORT_PORT
server {
  listen 8080;
  listen [::]:8080;
  server_name sync.example.com;
  # a Sync request can be up to 2.5 MB, more than nginx's 1 MB default: without this,
  # large batches fail with 413 (docs/reverse-proxy.md#request-size)
  client_max_body_size 10m;
  location / {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 120;
    proxy_connect_timeout 10;
    gzip off;
  }
}

# the accounts pages (FXA_CONTENT_URL), to FXA_CONTENT_EXPORT_PORT
server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name accounts.example.com;
  ssl_certificate /etc/letsencrypt/live/accounts.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/accounts.example.com/privkey.pem;
  location / {
    proxy_pass http://[::1]:3030;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

# the accounts API (FXA_AUTH_URL), to FXA_AUTH_EXPORT_PORT
server {
  listen 4443 ssl;
  listen [::]:4443 ssl;
  http2 on;
  server_name api.example.com;
  ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

# the accounts profile server (FXA_PROFILE_URL), to FXA_PROFILE_EXPORT_PORT
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name profile.example.com;
  ssl_certificate /etc/letsencrypt/live/profile.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/profile.example.com/privkey.pem;
  # the avatars: /img/ to FXA_PROFILE_STATIC_EXPORT_PORT, without /img
  location /img/ {
    proxy_pass http://127.0.0.1:1112/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
  location / {
    proxy_pass http://127.0.0.1:1111;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}
