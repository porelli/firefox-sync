# Self-hosted Mozilla accounts (FxA), without their database: with sync.yml and its database's
# file, and exactly one of fxa-mysql.yml and fxa-mariadb.yml (docs/install/compose.md#the-compose-files).
# Relative paths are relative to this directory, compose/.
#
# Uses amd64 and arm64 builds of Mozilla's releases (mozilla/fxa-mono). The public URLs below
# must be served by your reverse proxy, see docs/reverse-proxy.md#host-names-and-ports:
#   FXA_CONTENT_URL  -> fxa-content:3030 (accounts web pages, Firefox reads /.well-known from here)
#   FXA_AUTH_URL     -> fxa-auth:9000    (accounts API and OAuth; with the admin UI,
#                       POST /v1/account/create -> ffs-admin:8081, the sign-up gate)
#   FXA_PROFILE_URL  -> fxa-profile:1111 (and /img/ -> fxa-profile-static:1112)
#   SYNC_PUBLIC_URL -> syncstorage   (as without FxA)
#   host of ADMIN_OIDC_REDIRECT_URL -> ffs-admin:8080 (optional: sign in to the admin UI with these accounts)
# In .env, point the tokenserver to this FxA: FXA_OAUTH_SERVER_URL=http://fxa-auth:9000/v1
# and FXA_EMAIL_DOMAIN to the host name of FXA_AUTH_URL.

x-fxa: &fxa
  # amd64 and arm64 builds of Mozilla's releases, tested before publishing (see docs/reference/images.md#accounts)
  image: ${FXA_IMAGE:-ghcr.io/porelli/firefox-sync}:${FXA_VERSION:-fxa-mono-latest}
  platform: linux/${FXA_ARCH:-amd64}
  restart: unless-stopped

# the accounts database: fxa-db (fxa-mysql.yml or fxa-mariadb.yml), or your own MySQL 8.4 or 9
# (9 with our images) or MariaDB 11.4+ server (12 with our images; FXA_DB_CONTAINERS=0,
# docs/reference/database-users.md#the-accounts)
x-fxa-mysql: &fxa-mysql
  MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
  MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
  MYSQL_USERNAME: ${FXA_MYSQL_USER:-root}
  MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}

services:
  fxa-redis:
    # the accounts' cache (sessions' last use, revoked tokens), no volume: lost on a recreate
    # anyway, so it follows Redis's newest major
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # (the one-shot services, restart: "no", have no healthcheck: their exit status counts,
  # see sync.yml)
  # the image runs as app (10001), new volumes are created as root
  fxa-keys-owner:
    <<: *fxa
    user: root
    command: [chown, "10001:10001", /fxa-keys]
    volumes:
      - fxa-keys:/fxa-keys
    restart: "no"

  # your own server for the accounts (FXA_DB_CONTAINERS=0): the setup migrations of
  # db/mysql/setup/fxa-<FXA_DB> (the users and grants of database-setup-fxa.sql) at every start,
  # before the migrations; applied as FXA_DB_BOOTSTRAP_USER when it is set, otherwise checked, as
  # sync.yml's db-bootstrap. With fxa-db: nothing (fxa-policy records them)
  fxa-db-bootstrap:
    # (its image, the client of the accounts database, and its engine: the database's file)
    entrypoint: [bash, /ffs-db/db-setup.sh]
    command: [fxa]
    restart: "no"
    environment:
      FFS_SETUP_PENDING: docker compose run --rm --no-deps fxa-db-bootstrap pending fxa
      FXA_DB_CONTAINERS: ${FXA_DB_CONTAINERS:-1}
      FXA_DB_BOOTSTRAP_USER: ${FXA_DB_BOOTSTRAP_USER:-}
      FXA_DB_BOOTSTRAP_PASSWORD: ${FXA_DB_BOOTSTRAP_PASSWORD:-}
      FXA_MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      FXA_MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
      FXA_MYSQL_USER: ${FXA_MYSQL_USER:-root}
      FXA_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
      FXA_MYSQL_POLICY_USER: ${FXA_MYSQL_POLICY_USER:-}
      FXA_MYSQL_POLICY_PASSWORD: ${FXA_MYSQL_POLICY_PASSWORD:-}
      FXA_ADMIN_DB_PASSWORD: ${FXA_ADMIN_DB_PASSWORD:-}
      # MySQL with mysql_native_password (an accounts image without mozilla/fxa#21554): the
      # "-- native:" lines of db/mysql/setup/fxa-mysql, as prepare_environment.sh writes them
      FXA_MYSQL_ARGS: ${FXA_MYSQL_ARGS:-}
    volumes:
      # db-setup.sh and the setup migrations (db/mysql/setup/)
      - ../db:/ffs-db:ro

  fxa-migrations:
    <<: *fxa
    working_dir: /fxa/packages/db-migrations
    # retried: your own server has no healthcheck to wait for, it may not answer yet
    command: [sh, -c, "for i in $$(seq 1 60); do node bin/patcher.mjs && exit 0; sleep 5; done; exit 1"]
    depends_on:
      fxa-db-bootstrap:
        condition: service_completed_successfully
    environment:
      AUTH_MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      AUTH_MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
      AUTH_MYSQL_USERNAME: ${FXA_MYSQL_USER:-root}
      AUTH_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
      OAUTH_MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      OAUTH_MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
      OAUTH_MYSQL_USERNAME: ${FXA_MYSQL_USER:-root}
      OAUTH_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
      PROFILE_MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      PROFILE_MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
      PROFILE_MYSQL_USERNAME: ${FXA_MYSQL_USER:-root}
      PROFILE_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
      PUSHBOX_MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      PUSHBOX_MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
      PUSHBOX_MYSQL_USERNAME: ${FXA_MYSQL_USER:-root}
      PUSHBOX_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
    # (and the database container: the database's file)
    restart: "no"

  # who can create an account (FXA_SIGNUPS, FXA_SIGNUP_ALLOWLIST, FXA_MAX_ACCOUNTS), enforced by the
  # accounts database itself; also the database user of the admin UI. See docs/reference/database-users.md#the-accounts
  fxa-policy:
    image: ${ADMIN_IMAGE:-${IMAGE_REPOSITORY:-${REPOSITORY:-}}:admin-latest}
    command: [fxa-init]
    environment:
      FXA_DB_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      FXA_DB_PORT: ${FXA_MYSQL_PORT:-3306}
      # installs the policy and grants ffs_admin: FXA_MYSQL_POLICY_USER, empty: FXA_MYSQL_USER
      # (with its own password: fxa-init picks the pair, like the Quadlet)
      FXA_DB_ROOT_USER: ${FXA_MYSQL_POLICY_USER:-}
      FXA_DB_ROOT_PASSWORD: ${FXA_MYSQL_POLICY_PASSWORD:-}
      FXA_MYSQL_USER: ${FXA_MYSQL_USER:-root}
      FXA_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
      FXA_ADMIN_DB_PASSWORD: ${FXA_ADMIN_DB_PASSWORD:-}
      FXA_SIGNUPS: ${FXA_SIGNUPS:-open}
      FXA_SIGNUP_ALLOWLIST: ${FXA_SIGNUP_ALLOWLIST:-}
      # the most accounts: N or unlimited (every start), initial:N (once, then the admin UI)
      FXA_MAX_ACCOUNTS: ${FXA_MAX_ACCOUNTS:-initial:unlimited}
    depends_on:
      fxa-migrations:
        condition: service_completed_successfully
    restart: "no"

  fxa-auth:
    <<: *fxa
    working_dir: /fxa/packages/fxa-auth-server/dist/packages/fxa-auth-server
    # keys are only generated when missing, the volume keeps them across restarts
    command:
      - sh
      - -c
      - >-
        node scripts/gen_keys.js &&
        node scripts/oauth_gen_keys.js &&
        node scripts/gen_vapid_keys.js &&
        node /fxa-config/oauth-clients.js /fxa-keys/oauth-clients.json &&
        exec node bin/key_server.js
    environment:
      NODE_ENV: prod
      CONFIG_FILES: /fxa-keys/oauth-clients.json
      IP_ADDRESS: 0.0.0.0
      PUBLIC_URL: ${FXA_AUTH_URL}
      OAUTH_URL: ${FXA_AUTH_URL}
      CONTENT_SERVER_URL: ${FXA_CONTENT_URL}
      FXA_OPENID_ISSUER: ${FXA_CONTENT_URL}
      # must be the host of FXA_AUTH_URL, it signs and checks the OAuth assertions
      ISSUER: ${FXA_EMAIL_DOMAIN}
      PROFILE_SERVER_URL: http://fxa-profile:1111
      SYNC_TOKENSERVER_URL: ${SYNC_PUBLIC_URL:-${SYNCSTORAGE_DOMAIN:-}}
      CORS_ORIGIN: ${FXA_CONTENT_URL}
      # the client IP for the rate limits is this far from the end of X-Forwarded-For:
      # 2 = one reverse proxy in front (Mozilla's default, 3, lets clients pick their IP)
      CLIENT_ADDRESS_DEPTH: ${FXA_CLIENT_ADDRESS_DEPTH:-2}
      # how long Firefox's access tokens live (Mozilla's default: 365 minutes), see docs/admin/accounts.md#sign-out-and-disable
      FXA_EXPIRATION_ACCESS_TOKEN: ${FXA_ACCESS_TOKEN_LIFETIME:-60 minutes}
      # when sessions were last used (the admin UI shows it): for every account, Mozilla
      # samples 30% of them
      LASTACCESSTIME_UPDATES_SAMPLE_RATE: 1
      # the OAuth client of the admin UI (config/fxa/oauth-clients.js), with ADMIN_FXA_CLIENT_ID
      ADMIN_FXA_CLIENT_ID: ${ADMIN_FXA_CLIENT_ID:-}
      ADMIN_FXA_CLIENT_SECRET: ${ADMIN_FXA_CLIENT_SECRET:-}
      ADMIN_OIDC_REDIRECT_URL: ${ADMIN_OIDC_REDIRECT_URL:-}
      # clients that never skip the sign-in code: Mozilla's defaults and the admin UI, so
      # that a password alone (an unconfirmed session) cannot sign in to the admin UI
      SERVICES_WITH_EMAIL_VERIFICATION: 32aaeb6f1c21316a,98e6508e88680e1a,${ADMIN_FXA_CLIENT_ID:-}
      # secrets
      # the auth server signs OAuth assertions with OAUTH_SERVER_SECRET_KEY and accepts
      # those signed with one of AUTH_SERVER_SECRETS: they must share the secret
      # (required: as SYNC_MASTER_SECRET in sync.yml, compose read no .env without it)
      OAUTH_SERVER_SECRET_KEY: "${FXA_OAUTH_SECRET:?set it in .env; compose read none, run it in the checkout with COMPOSE_FILE in .env, or add --env-file .env to -f compose/... (docs/upgrading.md#files-that-moved)}"
      OAUTH_SERVER_SECRETS: ${FXA_OAUTH_SECRET}
      AUTH_SERVER_SECRETS: ${FXA_OAUTH_SECRET}
      AUTH_SERVER_SHARED_SECRET: ${FXA_AUTH_SECRET}
      PROFILE_SERVER_AUTH_SECRET_BEARER_TOKEN: ${FXA_PROFILE_SECRET}
      FLOW_ID_KEY: ${FXA_FLOW_ID_KEY}
      SESSION_TOKEN_HANDLE_KEY: ${FXA_SESSION_TOKEN_HANDLE_KEY}
      SECRET_KEY_FILE: /fxa-keys/secret-key.json
      PUBLIC_KEY_FILE: /fxa-keys/public-key.json
      VAPID_KEYS_FILE: /fxa-keys/vapid-keys.json
      FXA_OPENID_KEYFILE: /fxa-keys/openid-key.json
      FXA_OPENID_NEWKEYFILE: /fxa-keys/openid-newKey.json
      FXA_OPENID_OLDKEYFILE: /fxa-keys/openid-oldKey.json
      # databases
      DB: mysql
      AUTH_MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      AUTH_MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
      AUTH_MYSQL_USERNAME: ${FXA_MYSQL_USER:-root}
      AUTH_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
      <<: *fxa-mysql
      PUSHBOX_ENABLED: "true"
      PUSHBOX_MYSQL_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      PUSHBOX_MYSQL_PORT: ${FXA_MYSQL_PORT:-3306}
      PUSHBOX_MYSQL_USERNAME: ${FXA_MYSQL_USER:-root}
      PUSHBOX_MYSQL_PASSWORD: ${FXA_MYSQL_PASSWORD}
      DB_AUTO_UPDATE_CLIENTS: "true"
      REDIS_HOST: fxa-redis
      ACCESS_TOKEN_REDIS_HOST: fxa-redis
      REFRESH_TOKEN_REDIS_HOST: fxa-redis
      CUSTOMS_REDIS_HOST: fxa-redis
      RATELIMIT_REDIS_HOST: fxa-redis
      METRICS_REDIS_HOST: fxa-redis
      AUTH_CACHE_REDIS_HOST: fxa-redis
      RECOVERY_PHONE_REDIS_HOST: fxa-redis
      PASSKEY_REDIS_HOST: fxa-redis
      # email
      SMTP_HOST: ${FXA_SMTP_HOST}
      SMTP_PORT: ${FXA_SMTP_PORT}
      SMTP_USER: ${FXA_SMTP_USER}
      SMTP_PASS: ${FXA_SMTP_PASS}
      SMTP_SECURE: ${FXA_SMTP_SECURE}
      SMTP_SENDER: ${FXA_SMTP_SENDER}
      # Mozilla/Google cloud services this deployment does not have
      FIRESTORE_ENABLED: "false"
      SNS_TOPIC_ARN: disabled
      GEODB_ENABLED: "false"
      AUTH_GLEAN_ENABLED: "false"
      CUSTOMS_SERVER_URL: none
      RECOVERY_PHONE__ENABLED: "false"
      RECOVERY_PHONE__TWILIO__CREDENTIAL_MODE: ""
      # the security history (fxa.securityEvents: sign-ins, password and 2-step changes, with
      # IP addresses), shown in the account settings and the admin UI: FXA_ACCOUNT_EVENTS
      ACCOUNT_EVENTS_ENABLED: ${FXA_ACCOUNT_EVENTS:-false}
      # with it Mozilla skips the sign-in code for 7 days after a confirmed sign-in from the
      # same IP address: never here, a password alone does not sign in (docs/accounts.md#security-history)
      IP_PROFILING_RECENCY: 0
      LOG_LEVEL: ${FXA_LOG_LEVEL:-INFO}
    volumes:
      - fxa-keys:/fxa-keys
      - ../config/fxa:/fxa-config:ro
    depends_on:
      fxa-keys-owner:
        condition: service_completed_successfully
      fxa-policy:
        condition: service_completed_successfully
      fxa-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/__heartbeat__').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 300s
      interval: 15s
      timeout: 10s
      retries: 5
    ports:
      - ${FXA_AUTH_EXPORT_PORT:-127.0.0.1:9000}:9000

  fxa-content:
    <<: *fxa
    working_dir: /fxa/packages/fxa-content-server
    command:
      - sh
      - -c
      - >-
        node /fxa-config/content-server.js /tmp/content-server.json &&
        exec node server/bin/fxa-content-server.js
    environment:
      NODE_ENV: production
      CONFIG_FILES: /tmp/content-server.json
      CONTENT_SESSION_SECRET: ${FXA_CONTENT_SESSION_SECRET}
      PUBLIC_URL: ${FXA_CONTENT_URL}
      FXA_URL: ${FXA_AUTH_URL}
      FXA_OAUTH_URL: ${FXA_AUTH_URL}
      FXA_PROFILE_URL: ${FXA_PROFILE_URL}
      FXA_PROFILE_IMAGES_URL: ${FXA_PROFILE_URL}/img
      SYNC_TOKENSERVER_URL: ${SYNC_PUBLIC_URL:-${SYNCSTORAGE_DOMAIN:-}}
      # QR code pairing with phones: Mozilla's server unless the pairing profile runs one here
      PAIRING_SERVER_BASE_URI: ${FXA_PAIRING_URL:-wss://channelserver.services.mozilla.com}
      # as in fxa-auth: the admin UI never skips the sign-in code (Mozilla's default + the admin UI)
      SERVICES_WITH_EMAIL_VERIFICATION: 32aaeb6f1c21316a,${ADMIN_FXA_CLIENT_ID:-}
      FLOW_ID_KEY: ${FXA_FLOW_ID_KEY}
      FEATURE_FLAGS_REDIS_HOST: fxa-redis
      REDIS_HOST: fxa-redis
      GEODB_ENABLED: "false"
    volumes:
      - ../config/fxa:/fxa-config:ro
    depends_on:
      fxa-auth:
        condition: service_healthy
      # its pages read the names and avatars from the profile server: up when they answer
      fxa-profile:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3030/__heartbeat__').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 300s
      interval: 15s
      timeout: 10s
      retries: 5
    ports:
      - ${FXA_CONTENT_EXPORT_PORT:-127.0.0.1:3030}:3030

  fxa-profile:
    <<: *fxa
    working_dir: /fxa/packages/fxa-profile-server
    command: [node, bin/server.js]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB: mysql
      <<: *fxa-mysql
      PUBLIC_URL: ${FXA_PROFILE_URL}
      AUTH_SERVER_URL: http://fxa-auth:9000/v1
      OAUTH_SERVER_URL: http://fxa-auth:9000/v1
      AUTH_SECRET_BEARER_TOKEN: ${FXA_PROFILE_SECRET}
      REDIS_HOST: fxa-redis
      WORKER_URL: http://fxa-profile-worker:1113
      IMG: local
      IMG_URL: ${FXA_PROFILE_URL}/img/a/{id}
      IMG_PROVIDERS_FXA: ^${FXA_PROFILE_URL}/img/a/[0-9a-f]{32}$$
      EVENTS_ENABLED: "false"
    volumes:
      - fxa-profile-images:/fxa/packages/fxa-profile-server/var/public
    depends_on:
      fxa-migrations:
        condition: service_completed_successfully
      fxa-redis:
        condition: service_healthy
    # /__heartbeat__ also asks the accounts database (/__lbheartbeat__ only the process); as slow
    # to start as fxa-auth under emulation
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1111/__heartbeat__').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 300s
      interval: 15s
      timeout: 10s
      retries: 5
    ports:
      - ${FXA_PROFILE_EXPORT_PORT:-127.0.0.1:1111}:1111

  fxa-profile-worker:
    <<: *fxa
    working_dir: /fxa/packages/fxa-profile-server
    command: [node, bin/worker.js]
    environment:
      NODE_ENV: production
      WORKER_HOST: 0.0.0.0
      IMG: local
    volumes:
      - fxa-profile-images:/fxa/packages/fxa-profile-server/var/public
    # its own HTTP server, where fxa-profile sends the uploaded avatars (port 1113, not published)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1113/__heartbeat__').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 300s
      interval: 15s
      timeout: 10s
      retries: 5

  fxa-profile-static:
    <<: *fxa
    working_dir: /fxa/packages/fxa-profile-server
    command: [node, bin/_static.js]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      IMG: local
    volumes:
      - fxa-profile-images:/fxa/packages/fxa-profile-server/var/public:ro
    # the default avatar, a file it serves like the uploaded ones
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1112/a/00000000000000000000000000000000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      start_period: 300s
      interval: 15s
      timeout: 10s
      retries: 5
    ports:
      - ${FXA_PROFILE_STATIC_EXPORT_PORT:-127.0.0.1:1112}:1112

  # optional, COMPOSE_PROFILES=pairing and FXA_PAIRING_URL=wss://pairing.example.com in .env
  fxa-pairing:
    image: ${FXA_PAIRING_IMAGE:-ghcr.io/porelli/firefox-sync:fxa-channelserver-latest}
    platform: linux/${FXA_ARCH:-amd64}
    profiles: [pairing]
    environment:
      PAIR_HOSTNAME: 0.0.0.0
      PAIR_PORT: 8000
      PAIR_HUMAN_LOGS: "true"
      # the reverse proxy, so that X-Forwarded-For is used for the per client limits
      PAIR_TRUSTED_PROXY_LIST: ${FXA_PAIRING_TRUSTED_PROXIES:-127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    # its /__heartbeat__; the image (debian slim) has no curl or wget: bash's /dev/tcp
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /__heartbeat__ HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - ${FXA_PAIRING_EXPORT_PORT:-127.0.0.1:8058}:8000
    restart: unless-stopped

  # the admin UI (COMPOSE_PROFILES=admin) also manages the accounts, and is the
  # sign-up gate: point POST /v1/account/create of FXA_AUTH_URL to ADMIN_GATE_EXPORT_PORT
  ffs-admin:
    environment:
      FXA_DB_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      FXA_DB_PORT: ${FXA_MYSQL_PORT:-3306}
      FXA_DB_PASSWORD: ${FXA_ADMIN_DB_PASSWORD:-}
      # initial:N (or not set): the admin UI manages max accounts, otherwise .env does (read-only)
      FXA_MAX_ACCOUNTS: ${FXA_MAX_ACCOUNTS:-initial:unlimited}
      FXA_AUTH_UPSTREAM: http://fxa-auth:9000
      # health check of the optional pairing server
      FXA_PAIRING_URL: ${FXA_PAIRING_URL:-}
      # the security history of the accounts, as fxa-auth records it
      FXA_ACCOUNT_EVENTS: ${FXA_ACCOUNT_EVENTS:-false}
      # accounts that did not confirm their email after this many hours are marked unconfirmed (empty: 72)
      ADMIN_UNCONFIRMED_HOURS: ${ADMIN_UNCONFIRMED_HOURS:-}
      # the accounts pages, allowed to read the refusals (CORS)
      FXA_CONTENT_URL: ${FXA_CONTENT_URL}
      # the public checks (ADMIN_PUBLIC_CHECK), the sign-up gate through FXA_AUTH_URL
      FXA_AUTH_URL: ${FXA_AUTH_URL}
      FXA_PROFILE_URL: ${FXA_PROFILE_URL}
      # the configuration page: the accounts database, the gate's port, what fxa-auth runs with
      FXA_DB: ${FXA_DB:-mysql}
      ADMIN_GATE_EXPORT_PORT: ${ADMIN_GATE_EXPORT_PORT:-127.0.0.1:8091}
      FXA_CLIENT_ADDRESS_DEPTH: ${FXA_CLIENT_ADDRESS_DEPTH:-2}
      FXA_ACCESS_TOKEN_LIFETIME: ${FXA_ACCESS_TOKEN_LIFETIME:-60 minutes}
      # with ADMIN_FXA_CLIENT_ID, sign in with these accounts (see docs/admin/signing-in.md#self-hosted-accounts), unless set otherwise
      ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:-${ADMIN_FXA_CLIENT_ID:+${FXA_CONTENT_URL}}}
      ADMIN_OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-${ADMIN_FXA_CLIENT_ID:-}}
      ADMIN_OIDC_CLIENT_SECRET: ${ADMIN_OIDC_CLIENT_SECRET:-${ADMIN_FXA_CLIENT_SECRET:-}}
      ADMIN_OIDC_NAME: ${ADMIN_OIDC_NAME:-${ADMIN_FXA_CLIENT_ID:+Mozilla account}}
    depends_on:
      fxa-policy:
        condition: service_completed_successfully
    ports:
      - ${ADMIN_GATE_EXPORT_PORT:-127.0.0.1:8091}:8081

  # with COMPOSE_PROFILES=backup also the accounts databases, every night into the backups
  # volume: the sync backup service records the result. Run one now:
  # docker compose exec backup-fxa sh /ffs-backup/backup.sh now
  backup-fxa:
    # (its image, the client of the accounts database: the database's file)
    profiles: [backup]
    entrypoint: [sh, /ffs-backup/backup.sh]
    command: [loop]
    environment:
      BACKUP_SCOPE: accounts
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      FXA_DB_HOST: ${FXA_MYSQL_HOST:-fxa-db}
      FXA_DB_PORT: ${FXA_MYSQL_PORT:-3306}
      FXA_DB_USER: ${FXA_MYSQL_USER:-root}
      FXA_DB_PASSWORD: ${FXA_MYSQL_PASSWORD}
    # as the backup service's (sync.yml): backup.sh health
    healthcheck:
      test: ["CMD", "sh", "/ffs-backup/backup.sh", "health"]
      start_period: 1m
      interval: 1m
      timeout: 10s
      retries: 2
    volumes:
      - ../config/backup:/ffs-backup:ro
      - backups:/backups
    depends_on:
      fxa-policy:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  fxa-keys:
  fxa-profile-images:
  backups:
