# The bundled Caddy (PROXY=caddy, docs/reverse-proxy.md#the-bundled-caddy): the reverse proxy of
# the stack, HTTPS with certificates it gets itself (Let's Encrypt, CADDY_ACME_CA), in COMPOSE_FILE
# after the other files. It runs proxy/Caddyfile.bundled, which prepare_environment.sh writes from
# .env (on this network, the containers by name), with your snippets of proxy/caddy.d/. After a
# change of .env: ./prepare_environment.sh --render-proxy, then
# docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile.bundled

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:latest}
    restart: unless-stopped
    command: [caddy, run, --config, /etc/caddy/Caddyfile.bundled, --adapter, caddyfile]
    ports:
      # every address of this host; HTTP for the HTTP-01 challenge and the redirects to HTTPS,
      # UDP for HTTP/3
      - ${CADDY_HTTP_PORT:-80}:80
      - ${CADDY_HTTPS_PORT:-443}:443
      - ${CADDY_HTTPS_PORT:-443}:443/udp
    volumes:
      - ../proxy:/etc/caddy:ro
      # the certificates and their keys (and Caddy's own CA with CADDY_ACME_CA=internal)
      - caddy-data:/data
      - caddy-config:/config
    # its configuration loaded (its admin API, inside the container only); the sites answer
    # once what they proxy to does
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
