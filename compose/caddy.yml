# The bundled Caddy (PROXY=caddy, docs/reverse-proxy.md#the-bundled-caddy): the reverse proxy of
# the stack, HTTPS with certificates it gets itself (Let's Encrypt, CADDY_ACME_CA), in COMPOSE_FILE
# after the other files. It runs proxy/Caddyfile.bundled, which prepare_environment.sh writes from
# .env, with your snippets of proxy/caddy.d/. After a change of .env:
# ./prepare_environment.sh --render-proxy, then docker compose restart caddy

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:latest}
    restart: unless-stopped
    # on the host's network: it listens on CADDY_HTTP_PORT and CADDY_HTTPS_PORT of this host itself
    # (the http_port and https_port of Caddyfile.bundled), reaches the stack on the ports of .env,
    # and sees the clients' own addresses (PROXY_ADMIN_ALLOW, the accounts' limits): published
    # ports would show it the address of a gateway for some (rootless Podman, Docker's proxy of
    # IPv6). Docker Desktop: turn on its host networking. Ports under 1024 with rootless Podman:
    # docs/reverse-proxy.md#rootless-podman-and-ports-under-1024
    network_mode: host
    command: [caddy, run, --config, /etc/caddy/Caddyfile.bundled, --adapter, caddyfile]
    volumes:
      - ../proxy:/etc/caddy:ro
      # the certificates and their keys (and Caddy's own CA with CADDY_ACME_CA=internal)
      - caddy-data:/data
      - caddy-config:/config
    # running, its admin API up (on a socket of its own, not on the host's 127.0.0.1:2019); the
    # sites answer once what they proxy to does
    healthcheck:
      test: ["CMD", "test", "-S", "/config/caddy-admin.sock"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
